<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mlash · U14 全页设计原型</title>
<style>
:root{font-family:"Microsoft YaHei UI","Segoe UI","PingFang SC",sans-serif;font-size:14px;color-scheme:light;--canvas:#f2f2f7;--nav:#f6f6f8;--surface:#fff;--ink:#1d1d1f;--secondary:#686871;--line:#e3e3e8;--blue:#0066cc;--primary:#075fbe;--hover:#f1f3f6;--select:#e9f2fc;--green:#18724a;--red:#b32636;--orange:#865000;--shadow:0 9px 30px #20243418}
:root[data-theme=dark]{color-scheme:dark;--canvas:#000;--nav:#202020;--surface:#1c1c1e;--ink:#f5f5f7;--secondary:#a1a1aa;--line:#343436;--blue:#4da3ff;--primary:#075fbe;--hover:#29292c;--select:#132b43;--green:#64c98a;--red:#ff8a96;--orange:#efb66a;--shadow:0 9px 30px #0008}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{cursor:default;opacity:.5}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:192px minmax(0,1fr);height:100vh;min-height:520px;max-width:1500px;margin:auto;border:1px solid var(--line);background:var(--canvas)}.side{background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px}.nav{border:0;background:transparent;color:var(--ink);height:38px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 12px;width:100%;text-align:left}.nav svg{color:var(--blue)}.nav:hover{background:var(--hover)}.nav[aria-current=page]{background:var(--primary);color:white}.nav[aria-current=page] svg{color:white}.brand{margin-top:auto;color:var(--secondary);font-size:12px;padding:10px 12px}.brand b{font-weight:600}.brand img{width:23px;height:23px;vertical-align:middle;margin-right:6px}
.main{min-width:0;display:grid;grid-template-rows:46px minmax(0,1fr) 30px}.bar{display:grid;grid-template-columns:100px 1fr 100px;align-items:center;background:var(--nav);border-bottom:1px solid var(--line);padding:0 12px}.bar strong{justify-self:center;font-size:16px;font-weight:650}.bar .right{justify-self:end}.iconbtn,.textbtn{border:0;background:transparent;color:var(--blue);height:30px;min-width:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 6px}.iconbtn:hover,.textbtn:hover{background:var(--hover)}.iconbtn svg{width:19px;height:19px}.status{background:var(--nav);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--secondary);font-size:12px;white-space:nowrap;overflow:hidden}.status span{overflow:hidden;text-overflow:ellipsis}.status .alert{color:var(--red);margin-left:auto}
.viewport{overflow:auto;min-height:0}.page{padding:14px 16px 28px;max-width:1180px;margin:0 auto}.stack{display:grid;gap:12px}.group{background:var(--surface);border-radius:10px;overflow:hidden}.section{font-size:12px;font-weight:550;color:var(--secondary);margin:14px 10px 7px}.section:first-child{margin-top:4px}.row{width:100%;min-height:40px;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;text-align:left;padding:7px 12px;gap:10px;position:relative}.row+.row:before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--line)}.row:hover{background:var(--hover)}.row .symbol{width:24px;color:var(--blue);display:flex;justify-content:center;align-items:center;flex:none}.row .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.row .sub{font-size:11px;color:var(--secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .body{min-width:0;flex:1}.row .value{color:var(--secondary);white-space:nowrap;font-size:12px}.row .chev{color:var(--secondary);font-size:18px;margin-left:2px;line-height:1}.row.selected{background:var(--select)}.row .two{min-height:31px;display:flex;align-items:center}.row .badge{font-size:11px;border-radius:5px;background:var(--hover);padding:2px 5px;color:var(--secondary)}.row .delay{min-width:56px;text-align:right;color:var(--green);font-variant-numeric:tabular-nums}.row .delay.bad{color:var(--red)}.row .delay.unknown{color:var(--secondary)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:34px}.toolbar .grow{flex:1}.pill,.soft,.primary,.danger,.select{border:1px solid var(--line);border-radius:7px;min-height:30px;background:var(--surface);color:var(--ink);padding:4px 10px;white-space:nowrap}.pill:hover,.soft:hover,.select:hover{background:var(--hover)}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.danger{color:var(--red)}.select{min-width:120px;text-align:left}.search{min-width:100px;max-width:250px;width:27%;height:30px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:0 10px}.muted{color:var(--secondary);font-size:12px}.fine{font-size:11px;color:var(--secondary)}.headline{font-size:16px;font-weight:650}.spacer{flex:1}.line{border-top:1px solid var(--line)}.hint{font-size:12px;color:var(--secondary);padding:8px 10px}.inline{display:flex;align-items:center;gap:8px;min-width:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden}.kpi{padding:12px;background:var(--surface)}.kpi strong{display:block;margin-top:4px;font-size:18px;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:3px;background:var(--nav);width:max-content;max-width:100%;padding:3px;border-radius:8px}.tabs button{border:0;background:transparent;color:var(--secondary);border-radius:6px;min-height:28px;padding:3px 12px}.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0001}.tabs button:hover{color:var(--ink)}.node-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.node-head .muted{margin-top:2px}.node-list .row{min-height:39px}.node-list .row .body{max-width:calc(100% - 160px)}.node-list .row .value{display:none}.flag{display:inline-flex;width:25px;justify-content:center;font-size:17px;line-height:1}.switch{width:40px;height:24px;border:0;border-radius:30px;background:#8d8d93;position:relative;flex:none}.switch:after{content:"";width:18px;height:18px;background:white;border-radius:50%;position:absolute;left:3px;top:3px;box-shadow:0 1px 3px #0003}.switch.on{background:var(--primary)}.switch.on:after{left:19px}.editor{padding:12px}.field{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:12px;margin:8px 0}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:7px 9px;min-width:0}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.summary{padding:10px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.kv{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:12px}.kv dt{color:var(--secondary)}.kv dd{margin:0}.table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}.table th,.table td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}.table th{color:var(--secondary);font-size:12px;font-weight:500}.table tr:last-child td{border-bottom:0}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:var(--hover)}.chart{height:100px;background:var(--surface);padding:12px;border-radius:10px}.chart svg{width:100%;height:100%;stroke:var(--blue);stroke-width:2}.webgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.webcard{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px;min-height:90px}.webcard .top{display:flex;align-items:center;gap:8px}.webcard .mark{width:28px;height:28px;border-radius:6px;background:var(--nav);display:grid;place-items:center;font-size:17px}.webcard .name{font-weight:600}.webcard .result{display:flex;align-items:center;gap:7px;margin-top:11px}.webcard .result .textbtn{margin-left:auto}.empty{padding:52px 12px;text-align:center;color:var(--secondary)}.empty strong{display:block;color:var(--ink);margin-bottom:7px;font-size:15px}.review{position:fixed;right:14px;bottom:40px;display:flex;gap:5px;box-shadow:var(--shadow);border-radius:8px;background:var(--surface);padding:4px;border:1px solid var(--line)}.review button{font-size:11px;border:0;background:none;color:var(--secondary);padding:5px 7px;border-radius:5px}.review button:hover{background:var(--hover)}.popover{position:fixed;right:18px;top:56px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;min-width:185px;z-index:10}.popover button{display:block;width:100%;text-align:left;border:0;border-radius:5px;background:transparent;color:var(--ink);padding:8px}.popover button:hover{background:var(--hover)}.hidden{display:none!important}
@media(max-width:850px){.app{grid-template-columns:132px 1fr}.nav{padding:0 8px}.page{padding:10px}.webgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.field{grid-template-columns:1fr;gap:2px}.search{width:100%;max-width:none}.table .hide-narrow{display:none}}
@media(max-width:630px){.app{grid-template-columns:54px 1fr}.nav{font-size:0;justify-content:center;padding:0}.nav svg{width:20px;height:20px}.brand{font-size:0;padding:5px}.brand b{display:none}.bar{grid-template-columns:45px 1fr 45px}.webgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"></aside><div class="main"><header class="bar"><div id="leading"></div><strong id="page-title">Mlash</strong><div class="right" id="trailing"></div></header><main class="viewport" id="viewport"><div class="page" id="page"></div></main><footer class="status"><span id="status">设计原型 · 不执行实际操作</span><span class="alert" id="alarm"></span></footer></div></div>
<div class="review"><button data-action="theme">切换明暗</button><button data-action="scenario">切换状态</button><button data-action="tray">托盘预览</button><button data-action="reset">重置</button></div><div id="popover" class="popover hidden"></div>
<script>
const paths={home:'M12 3l9 8v10h-6v-6H9v6H3V11z',folder:'M3 5h6l2 3h10v12H3z',data:'M2 12h4l3-8 4 16 3-8h6',gear:'M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2M18.4 5.6l-2.2 2.2m-8.4 8.4-2.2 2.2M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8',rocket:'M4 17C5 9 12 4 21 3c-1 9-6 16-14 17l-3 2 1-5zM10 9l5 5',route:'M4 17h5l3-6h8m-5-4 5 4-5 4',gauge:'M3 17a9 9 0 0 1 18 0M12 17l5-7',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14m5 12 6 6',target:'M12 3v4m0 10v4M3 12h4m10 0h4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 8v6m0-9v.1',plus:'M12 4v16M4 12h16',back:'M15 4 7 12l8 8',more:'M4 12h.1m7.9 0h.1m7.9 0h.1',layers:'M12 3 3 8l9 5 9-5-9-5zM3 13l9 5 9-5',check:'M4 12l5 5L20 6',copy:'M8 7h12v14H8zM4 17V3h12',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 4v5l4 2',cloud:'M5 18a4 4 0 0 1 0-8 7 7 0 0 1 14 2 3 3 0 0 1 0 6z',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M3 12h18M12 3c-4 4-4 14 0 18M12 3c4 4 4 14 0 18'};
const ico=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.info}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const profiles=[{id:'remote',name:'示例订阅',kind:'远程订阅',detail:'更新于 09:40',flag:'●',candidate:true},{id:'file',name:'本地配置',kind:'文件快照',detail:'导入于昨日',flag:'',candidate:false}];
const nodes=[['🇭🇰','香港 01','VLESS','86 ms'],['🇯🇵','日本 02','Shadowsocks','132 ms'],['🇸🇬','新加坡 03','Trojan','178 ms'],['🇺🇸','美国 04','VLESS','267 ms'],['🌐','自动选择','策略组','—'],['🇹🇼','台湾 05','VLESS','101 ms'],['🇭🇰','香港 06','Shadowsocks','超时'],['🇯🇵','日本 07','VLESS','143 ms'],['🇸🇬','新加坡 08','Trojan','155 ms']];
const sites=[['▶','YouTube','www.youtube.com','132 ms'],['◎','ChatGPT','chatgpt.com','151 ms'],['G','Google','www.google.com','98 ms'],['◉','GitHub','github.com','112 ms'],['N','Netflix','www.netflix.com','超时'],['♪','TikTok','www.tiktok.com','192 ms'],['✈','Telegram','web.telegram.org','175 ms'],['☁','Cloudflare','www.cloudflare.com','95 ms']];
const s={view:'home',sub:'',tab:'traffic',config:'remote',setting:'',theme:'light',scenario:'normal',selected:'香港 01',group:'主要节点',search:'',testDone:false,paused:false};
const btn=(text,action,cls='soft')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
const tool=(name,action,title)=>`<button class="iconbtn" data-action="${action}" title="${title}" aria-label="${title}">${ico(name)}</button>`;
const row=(icon,title,value='',sub='',action='',right='›')=>`<button class="row" data-action="${action}"><span class="symbol">${icon.startsWith('<')?icon:ico(icon)}</span><span class="body"><span class="title">${title}</span>${sub?`<div class="sub">${sub}</div>`:''}</span>${value?`<span class="value">${value}</span>`:''}<span class="chev">${right}</span></button>`;
const section=(title,content)=>`<div><div class="section">${title}</div><div class="group">${content}</div></div>`;
function note(t){document.getElementById('status').textContent=t+' · 原型模拟';}
function renderShell(){document.documentElement.dataset.theme=s.theme;document.getElementById('side').innerHTML=['home','profiles','data','settings'].map((v,i)=>`<button class="nav" data-action="nav:${v}" aria-current="${s.view===v?'page':'false'}">${ico(['home','folder','data','gear'][i])}${['首页','配置','数据','设置'][i]}</button>`).join('')+`<div class="brand"><img src="../../resources/mlash.svg" alt=""><b>Mlash</b><div>设计稿 U14</div></div>`;document.getElementById('page-title').textContent=({home:'Mlash',profiles:'配置',data:'数据',settings:'设置'})[s.view];document.getElementById('leading').innerHTML=s.sub?tool('back','back','返回'):s.view==='home'?tool('target','probe','连通性测试'):'';document.getElementById('trailing').innerHTML=s.view==='profiles'&&!s.sub?tool('plus','import','导入配置'):s.view==='home'?tool('plus','import','导入配置'):'';document.getElementById('alarm').textContent=s.scenario==='error'?'恢复未完成 · 查看处理':s.scenario==='external'?'系统代理由其他程序管理':'';}
function render(){renderShell();document.getElementById('page').innerHTML=({home:home,profiles:profilesPage,data:dataPage,settings:settingsPage})[s.view]();document.getElementById('viewport').scrollTop=0;}
function home(){const unavailable=s.scenario==='empty',external=s.scenario==='external',failed=s.scenario==='error';const first=unavailable?'未连接':failed?'代理状态需处理':s.selected;const hint=unavailable?'还没有可用配置':external?'系统代理由其他程序管理':failed?'恢复意图已保留；请处理后重试':'系统代理已接管 · 规则模式';let html=`<div class="stack"><div class="group"><div class="row"><span class="symbol">${ico('rocket')}</span><span class="body"><span class="title headline">${first}</span><div class="sub">${hint}</div></span><button class="switch ${unavailable||failed?'':'on'}" data-action="toggle" aria-label="代理接管开关" title="代理接管开关"></button></div>${row('route','全局路由','规则模式','','mode')}${row('gauge','连通性测试','上次 86 ms','','probe','')}</div>`;if(unavailable)return html+`<div class="empty"><strong>还没有配置</strong><p>导入订阅或本地文件后选择节点。</p>${btn('导入配置','import','primary')}</div></div>`;html+=`<div class="toolbar"><button class="select" data-action="group">${ico('layers')} ${s.group}⌄</button><span class="grow"></span><input class="search" id="nodeSearch" placeholder="搜索节点" value="${esc(s.search)}">${tool('target','locate','定位当前')}${tool('gauge','test-group','测试本组')}${tool('more','node-options','排序与视图')}</div><div class="group node-list"><div class="node-head"><div><strong>示例订阅</strong><div class="muted">${s.group} · 当前 ${s.selected}</div></div><span class="muted">${nodes.length} 个成员</span></div>`;let shown=nodes.filter(n=>n[1].includes(s.search));html+=shown.length?shown.map(n=>`<div class="row ${s.selected===n[1]?'selected':''}"><span class="symbol flag">${n[0]}</span><button class="textbtn body" style="justify-content:flex-start;text-align:left;overflow:hidden;color:var(--ink)" data-action="node:${esc(n[1])}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n[1])}</span> <small class="muted">${n[2]}</small></button>${s.selected===n[1]?ico('check'):''}<button class="textbtn delay ${n[3]==='超时'?'bad':''}" data-action="delay:${esc(n[1])}" title="单独重新测速">${n[3]}</button>${tool('info','node-info:'+esc(n[1]),'节点详情')}</div>`).join(''):`<div class="empty"><strong>没有匹配节点</strong>调整搜索条件。</div>`;return html+`</div></div>`;}
function profilesPage(){if(s.sub==='detail')return profileDetail();if(s.sub)return configTask();return `<div class="stack">${section('导入',row('folder','导入配置','订阅、文件或节点链接','','import'))}${section('远程订阅',profileRow(profiles[0]))}${section('本地文件',profileRow(profiles[1]))}</div>`;}
function profileRow(p){return row(p.kind==='远程订阅'?'cloud':'folder',p.name,p.candidate?'候选待应用':'',`${p.kind} · ${p.detail}`,'profile:'+p.id);}
function profileDetail(){const p=profiles.find(p=>p.id===s.config);return `<div class="stack"><div class="group"><div class="summary"><strong class="headline">${p.name}</strong><span class="muted">${p.kind} · ${p.detail}</span><span class="spacer"></span>${btn('更新来源','update')}${btn(p.candidate?'应用候选':'使用配置','apply','primary')}</div><div class="hint line">运行版本 v3　·　${p.candidate?'候选 v4 已准备好；更新不会自动替换运行版':'没有待应用候选'}</div></div>${section('配置内容',row('route','规则','优先 / 原始 / 追加','','task:rules')+row('globe','DNS','沿用来源','','task:dns')+row('layers','节点与策略组','9 个节点','','task:nodes')+row('route','代理链','沿用来源','','task:chain'))}${section('来源与维护',row('cloud','来源与更新','自动更新关闭','','task:source')+row('info','版本与变化','运行 v3 · 候选 v4','','task:versions')+row('more','更多操作','','','task:maintenance'))}</div>`;}
function configTask(){const labels={rules:'规则',dns:'DNS',nodes:'节点与策略组',chain:'代理链',source:'来源与更新',versions:'版本与变化',maintenance:'维护'};let body='';if(s.sub==='rules')body=`<div class="toolbar"><div class="tabs"><button class="active">优先规则</button><button>原始规则</button><button>追加规则</button><button>内核实际规则</button></div><span class="spacer"></span>${btn('添加规则','prototype-action')}</div><div class="group">${row('globe','域名后缀 · example.org','直连','','prototype-action')}${row('route','进程名 · Example.exe','主要节点','','prototype-action')}</div><p class="fine">当前编辑对象：${profiles.find(p=>p.id===s.config).name}；保存只更新该配置的候选定义。</p>`;
else if(s.sub==='dns')body=section('DNS 来源',row('globe','模式','沿用订阅','','prototype-action')+row('route','覆盖设置','未启用','','prototype-action'));
else if(s.sub==='nodes')body=section('配置节点',nodes.slice(0,6).map(n=>row(`<span class="flag">${n[0]}</span>`,n[1],n[2],'','prototype-action')).join(''));
else if(s.sub==='chain')body=section('代理链',row('route','上游链','沿用订阅','','prototype-action')+row('layers','节点引用','无覆盖','','prototype-action'));
else if(s.sub==='source')body=section('来源状态',row('cloud','远程来源','上次更新成功','','prototype-action')+row('clock','自动更新','关闭','','prototype-action')+row('layers','节点源 / 规则源','2 项','','prototype-action'));
else if(s.sub==='versions')body=section('版本',row('check','运行版本','v3','','prototype-action')+row('clock','候选版本','v4 · 待应用','','prototype-action')+row('copy','上次良好','v2','','prototype-action'));
else body=section('维护',row('clock','重新加载','仅验证候选','','prototype-action')+row('copy','导出脱敏摘要','','','prototype-action')+row('more','删除配置','','','prototype-action'));
return `<div class="stack"><div class="inline"><span class="muted">${profiles.find(p=>p.id===s.config).name} / </span><strong>${labels[s.sub]}</strong></div>${body}<div class="actions">${btn('返回配置','back')}${['rules','dns','nodes','chain','source'].includes(s.sub)?btn('保存修改','save','primary'):''}</div></div>`;}
function dataPage(){let tabs=['traffic','connections','tests','logs'],names=['流量','连接','测试','日志'];let header=`<div class="stack"><div class="toolbar"><div class="tabs">${tabs.map((x,i)=>`<button class="${s.tab===x?'active':''}" data-action="tab:${x}">${names[i]}</button>`).join('')}</div><span class="spacer"></span>${s.tab==='connections'?btn(s.paused?'恢复刷新':'暂停刷新','pause'):s.tab==='logs'?btn('导出脱敏日志','export'):s.tab==='tests'?btn('编辑目标','prototype-action'):''}</div>`;return header+({traffic:traffic,connections:connections,tests:tests,logs:logs})[s.tab]()+`</div>`;}
function traffic(){return `<div class="stack"><div class="kpis"><div class="kpi"><span class="muted">↑ 上传</span><strong>18 KB/s</strong></div><div class="kpi"><span class="muted">↓ 下载</span><strong>42 KB/s</strong></div><div class="kpi"><span class="muted">活动连接</span><strong>12</strong></div></div><div class="chart"><svg viewBox="0 0 800 100" preserveAspectRatio="none" aria-label="示例流量曲线"><path d="M0 80 Q40 77 80 74 T160 61 T240 67 T320 44 T400 49 T480 24 T560 38 T640 18 T720 32 T800 23"/></svg></div><div class="fine">示例实时数据 · 本页可见时更新</div>${section('详情',row('data','累计流量','↑ 2.4 GB · ↓ 12.8 GB','','prototype-action')+row('gear','内核工作集','约 88 MB','','prototype-action'))}</div>`;}
function connections(){return `<div class="stack"><div class="toolbar"><div class="tabs"><button class="active">活动 12</button><button data-action="prototype-action">已结束 3</button></div><input class="search" placeholder="搜索目标、规则、进程"><span class="spacer"></span>${tool('gear','prototype-action','列设置')}</div><table class="table"><thead><tr><th>目标</th><th>命中规则</th><th class="hide-narrow">代理链</th><th>状态</th></tr></thead><tbody><tr data-action="connection"><td>example.org:443</td><td>DOMAIN-SUFFIX</td><td class="hide-narrow">主要节点 / 香港 01</td><td>活跃</td></tr><tr data-action="connection"><td>cdn.example.net:443</td><td>MATCH</td><td class="hide-narrow">DIRECT</td><td>活跃</td></tr></tbody></table>${s.sub==='connection'?`<div class="group"><div class="summary"><strong>连接详情 · example.org:443</strong><span class="spacer"></span>${btn('关闭详情','close-detail')}</div><dl class="kv"><dt>命中规则</dt><dd>DOMAIN-SUFFIX</dd><dt>代理链</dt><dd>主要节点 → 香港 01</dd><dt>上传 / 下载</dt><dd>18 KB / 62 KB</dd><dt>观测时间</dt><dd>当前快照</dd></dl><div class="actions">${btn('复制详情','prototype-action')}${btn('新建规则草稿','prototype-action')}</div></div>`:''}<div class="fine">${s.paused?'已暂停 · 这是冻结快照':'仅在此页可见时采样；连接详情是打开时快照'}</div></div>`;}
function tests(){return `<div class="stack"><div class="group summary"><span>测试节点</span><button class="select" data-action="prototype-action">🇭🇰 香港 01 ⌄</button><span class="spacer"></span>${btn(s.testDone?'重新测试':'开始测试','start-tests','primary')}${btn('清空结果','clear-tests')}</div><div class="fine">${s.testDone?'8 个目标 · 7 项响应 · 最近刚刚测试':'测试当前选中节点到常见网站的响应延迟'}</div><div class="webgrid">${sites.map(x=>`<div class="webcard"><div class="top"><span class="mark">${x[0]}</span><div><div class="name">${x[1]}</div><div class="fine">${x[2]}</div></div><span class="spacer"></span>${tool('info','site-info:'+x[1],x[1]+'详情')}</div><div class="result"><strong class="${x[3]==='超时'?'delay bad':'delay'}">${s.testDone?x[3]:'—'}</strong><span class="fine">${s.testDone?(x[3]==='超时'?'● 超时':'● 已响应'):'未测试'}</span><button class="textbtn" data-action="site-test:${x[1]}">重测</button></div></div>`).join('')}</div></div>`;}
function logs(){return `<div class="stack"><div class="toolbar"><button class="select" data-action="prototype-action">级别：全部 ⌄</button><input class="search" placeholder="搜索日志"><span class="spacer"></span>${btn('暂停','prototype-action')}${btn('回到最新','prototype-action')}</div><div class="group">${row('clock','09:40:12 · info','配置已加载','','prototype-action','')}${row('clock','09:39:58 · info','核心已就绪','','prototype-action','')}${row('clock','09:39:55 · warning','代理仍由其他程序管理','','prototype-action','')}</div><div class="fine">日志仅显示脱敏内容；清空视图不会删除日志文件。</div></div>`;}
function settingsPage(){if(s.sub)return settingsTask();return `<div class="stack">${section('外观',row('gear','外观','跟随系统','','setting:appearance')+row('gear','文字大小','100%','','setting:text'))}${section('通用',row('home','启动与托盘','','','setting:startup')+row('layers','轻量模式','开启','','setting:lightweight'))}${section('连接与网络',row('route','本地代理','端口 17890','','setting:network')+row('layers','TUN 虚拟网卡','未启用','','setting:tun')+row('globe','系统代理排除','','','setting:bypass'))}${section('内核与维护',row('gear','内核管理','v1.19.32','','setting:core')+row('clock','GeoData 与更新','','','setting:geo')+row('target','快捷键','','','setting:hotkeys'))}${section('数据与备份',row('copy','备份与恢复','','','setting:backup')+row('info','数据目录','','','setting:data'))}${section('关于',row('info','Mlash','版本 1.19.0','','setting:about'))}</div>`;}
function settingsTask(){const labels={appearance:'外观',text:'文字大小',startup:'启动与托盘',lightweight:'轻量模式',network:'本地代理',tun:'TUN 虚拟网卡',bypass:'系统代理排除',core:'内核管理',geo:'GeoData 与更新',hotkeys:'快捷键',backup:'备份与恢复',data:'数据目录',about:'关于 Mlash'};let rows={appearance:section('主题',row('gear','跟随系统','当前','','prototype-action')+row('gear','浅色','','','prototype-action')+row('gear','深色','','','prototype-action')),text:section('比例',row('gear','90%','','','prototype-action')+row('gear','100%','当前','','prototype-action')+row('gear','110%','','','prototype-action')+row('gear','120%','','','prototype-action')),startup:section('启动',row('home','登录时启动','关闭','','prototype-action')+row('rocket','启动时运行内核','开启','','prototype-action')+row('route','恢复上次接管意图','开启','','prototype-action')+row('gear','托盘单击','显示主窗口','','prototype-action')),lightweight:section('窗口生命周期',row('layers','关闭窗口时释放界面','开启','托盘重开时重新创建界面','prototype-action')),network:section('本地代理',row('route','监听端口','17890','','prototype-action')+row('data','日志级别','warning','','prototype-action')+row('globe','IPv6','沿用订阅','','prototype-action')+row('gauge','统一延迟','沿用订阅','','prototype-action')),tun:section('TUN 状态',row('layers','权限服务','未安装','','prototype-action')+row('route','虚拟网卡','未启用','','prototype-action')+row('info','冲突与恢复','','','prototype-action')),bypass:section('排除列表',row('globe','系统代理排除','3 项','','prototype-action')),core:section('内核管理',row('gear','当前内核','v1.19.32','','prototype-action')+row('clock','历史版本','2 个','','prototype-action')+row('target','选择并预检新内核','','','prototype-action')),geo:section('数据维护',row('globe','GeoData','最近更新成功','','prototype-action')+row('clock','更新策略','手动','','prototype-action')),hotkeys:section('快捷键',row('target','显示主窗口','未设置','','prototype-action')+row('rocket','开启代理','未设置','','prototype-action')),backup:section('备份任务',row('copy','创建备份','','','prototype-action')+row('clock','恢复备份','','','prototype-action')+row('gear','自动备份','关闭','','prototype-action')+row('cloud','WebDAV','未配置','','prototype-action')),data:section('本地数据',row('folder','配置目录','','','prototype-action')+row('copy','复制脱敏诊断摘要','','','prototype-action')),about:section('版本',row('info','Mlash','1.19.0','','prototype-action')+row('gear','Qt','6.10.2','','prototype-action'))};return `<div class="stack"><strong>${labels[s.sub]}</strong>${rows[s.sub]}${['network','tun','bypass','core','geo','hotkeys','backup'].includes(s.sub)?`<div class="actions">${btn('取消','back')}${btn('预检并应用','save','primary')}</div>`:''}</div>`;}
function pop(items){const p=document.getElementById('popover');p.innerHTML=items.map(([t,a])=>`<button data-action="${a}">${t}</button>`).join('');p.classList.remove('hidden')}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target){if(!e.target.closest('#popover'))document.getElementById('popover').classList.add('hidden');return}const a=target.dataset.action;if(!a)return;document.getElementById('popover').classList.add('hidden');if(a.startsWith('nav:')){s.view=a.slice(4);s.sub='';render()}else if(a==='back'){if(s.view==='profiles'&&s.sub!=='detail')s.sub='detail';else s.sub='';render()}else if(a==='theme'){s.theme=s.theme==='light'?'dark':'light';render()}else if(a==='scenario'){s.scenario=({normal:'empty',empty:'external',external:'error',error:'normal'})[s.scenario];s.view='home';s.sub='';render();note('切换状态 '+s.scenario)}else if(a==='reset'){Object.assign(s,{view:'home',sub:'',tab:'traffic',config:'remote',setting:'',theme:'light',scenario:'normal',selected:'香港 01',group:'主要节点',search:'',testDone:false,paused:false});render();note('设计原型已重置')}else if(a==='tray'){pop([['运行中 · 示例订阅','prototype-action'],['代理接管：开启','toggle'],['规则模式','mode'],['当前组：主要节点','group'],['打开主窗口','nav:home'],['设置','nav:settings']])}else if(a==='mode'){pop([['✓ 规则模式','choose-mode:规则模式'],['全局模式','choose-mode:全局模式'],['直连模式','choose-mode:直连模式']])}else if(a.startsWith('choose-mode:')){note('切换到 '+a.slice(12)+'；本稿仅演示反馈')}else if(a==='group'){pop([['✓ 主要节点','choose-group:主要节点'],['香港','choose-group:香港'],['日本','choose-group:日本'],['自动选择','choose-group:自动选择']])}else if(a.startsWith('choose-group:')){s.group=a.slice(13);render();note('已切换浏览组；运行配置不变')}else if(a==='node-options'){pop([['默认排序','prototype-action'],['按名称排序','prototype-action'],['按延迟排序','prototype-action'],['切换卡片视图','prototype-action'],['本组测试设置','prototype-action']])}else if(a.startsWith('node:')){s.selected=a.slice(5);render();note('节点切换示例：'+s.selected)}else if(a.startsWith('delay:')||a.startsWith('site-test:'))note('仅重新测试该目标；不切换节点');else if(a.startsWith('node-info:')||a.startsWith('site-info:'))note('在原对象位置展开详情：'+a.split(':')[1]);else if(a.startsWith('profile:')){s.config=a.slice(8);s.sub='detail';render()}else if(a.startsWith('task:')){s.sub=a.slice(5);render()}else if(a.startsWith('tab:')){s.tab=a.slice(4);s.sub='';render()}else if(a.startsWith('setting:')){s.sub=a.slice(8);render()}else if(a==='connection'){s.sub='connection';render()}else if(a==='close-detail'){s.sub='';render()}else if(a==='pause'){s.paused=!s.paused;render();note(s.paused?'连接快照已冻结':'重新开始连接采样')}else if(a==='start-tests'){s.testDone=true;render();note('测试完成示例')}else if(a==='clear-tests'){s.testDone=false;render();note('已清空本次结果')}else if(a==='import'){s.view='profiles';s.sub='';render();note('从配置页进入导入任务')}else if(a==='toggle')note('接管意图与系统实际状态须回读；原型未写系统');else if(a==='save'||a==='apply'||a==='update')note('先验证、执行、回读；原型未保存或联网');else if(a==='probe'||a==='test-group'||a==='locate')note('只读操作示例：'+a);else note('此为设计入口；原型不执行实际操作');});
document.addEventListener('input',e=>{if(e.target.id==='nodeSearch'){s.search=e.target.value;const start=e.target.selectionStart;render();const field=document.getElementById('nodeSearch');field.focus();field.setSelectionRange(start,start)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('popover').classList.add('hidden')});
render();
</script>
</body>
