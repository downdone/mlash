<html lang="zh-CN">
<head>

<title>Mlash · U09 设计预览</title>
<style>
:root{color-scheme:dark;--canvas:#000;--nav:#202020;--group:#1c1c1e;--line:#343436;--ink:#f5f5f7;--muted:#a1a1aa;--blue:#4da3ff;--select:#075fbe;--hover:#29292d;--good:#64c98a;--bad:#ff8a96;--focus:#8fc5ff}
:root[data-theme=light]{color-scheme:light;--canvas:#f2f2f7;--nav:#f5f5f7;--group:#fff;--line:#e3e3e8;--ink:#1d1d1f;--muted:#63636b;--blue:#0066cc;--select:#0066cc;--hover:#ebedf3;--good:#18724a;--bad:#b32636;--focus:#0066cc}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}.review{min-height:48px;padding:10px 20px;display:flex;align-items:center;gap:14px;background:var(--group);border-bottom:1px solid var(--line)}.review span{font-size:12px;color:var(--muted);flex:1}.review b{font-size:13px}.review button,.review a{background:none;color:var(--blue);border:0;text-decoration:none;font-size:12px;padding:5px}
.shell{display:grid;grid-template-columns:204px minmax(0,1fr);height:calc(100vh - 49px);min-height:500px}.sidebar{background:var(--nav);padding:24px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column}.sidebar nav{display:grid;gap:4px}.nav{background:none;border:0;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:7px;text-align:left;font-weight:550}.nav svg{color:var(--blue)}.nav[aria-current=page]{background:var(--select);color:#fff}.nav[aria-current=page] svg{color:#fff}.brand{margin-top:auto;padding:16px 12px;color:var(--muted);font-size:12px}.main{min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}.toolbar{height:56px;flex:none;background:var(--nav);border-bottom:1px solid var(--line);display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center;padding:0 16px}.toolbar h1{font-size:16px;text-align:center;margin:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toolbar .right{justify-self:end}.icon{background:none;border:0;padding:7px;display:inline-flex;color:var(--blue);border-radius:6px;align-items:center;justify-content:center}.icon:hover{background:var(--hover)}.page{overflow:auto;padding:22px 24px 30px;flex:1}.section{margin:24px 0 7px;padding-left:16px;color:var(--muted);font-size:12px;font-weight:550}.group{background:var(--group);border-radius:10px;overflow:hidden}.row{position:relative;display:flex;align-items:center;gap:14px;min-height:50px;padding:10px 16px;width:100%;background:none;border:0;text-align:left}.row+.row:before,.node+.node:before{position:absolute;top:0;left:52px;right:0;height:1px;background:var(--line);content:""}.row svg{color:var(--blue)}.row .value{margin-left:auto;color:var(--muted);white-space:nowrap}.row .chevron{color:var(--muted);font-size:22px;margin-left:2px}.row:hover{background:var(--hover)}.title{display:block;font-weight:500}.sub{display:block;color:var(--muted);font-size:11px;margin-top:2px}.row .maintext{min-width:0;flex:1}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.switch{width:45px;height:27px;border:0;background:#69696f;border-radius:20px;position:relative;flex:none}.switch:after{content:"";width:23px;height:23px;border-radius:50%;background:#fff;position:absolute;left:2px;top:2px}.switch[aria-checked=true]{background:var(--select)}.switch[aria-checked=true]:after{left:20px}.tools{display:flex;align-items:center;gap:7px;margin:18px 0 10px}.tools input{margin-left:auto;max-width:210px;min-width:80px;width:35%;background:var(--group);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px}.group-select{background:var(--group);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:6px;max-width:180px}.node{display:flex;align-items:center;position:relative;min-height:56px;padding:0 12px 0 16px;gap:10px}.node:hover{background:var(--hover)}.node .body{display:flex;align-items:center;gap:14px;min-width:0;flex:1;border:0;background:none;text-align:left;padding:9px 0}.flag{font-size:25px;flex:none;width:28px;text-align:center}.node .check{color:var(--blue);font-size:18px;width:18px}.delay{color:var(--good);border:0;border-radius:5px;background:none;padding:6px;min-width:65px;text-align:right;font-size:12px}.delay:hover{background:var(--hover);text-decoration:underline}.delay.failed{color:var(--bad)}.info{border:0;background:none;color:var(--blue);padding:6px;display:flex}.info svg{width:21px;height:21px}.grouphead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:550}.grouphead svg{color:var(--blue)}.caption{color:var(--muted);font-size:12px;padding:9px 16px;margin:0}.state{margin-top:auto;flex:none;min-height:30px;border-top:1px solid var(--line);display:flex;align-items:center;padding:5px 18px;color:var(--muted);font-size:11px;gap:12px}.state span:first-child{flex:1}.tag{color:var(--blue);font-size:11px;margin-left:10px}.tabs{display:flex;gap:4px;max-width:420px;margin:0 auto 20px;padding:3px;background:var(--nav);border-radius:7px}.tabs button{flex:1;border:0;background:none;padding:5px;border-radius:5px;color:var(--muted)}.tabs button[aria-selected=true]{background:var(--group);color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden}.metric{padding:18px;background:var(--group)}.metric strong{display:block;font-size:23px;margin-top:7px;font-weight:600}.metric small{color:var(--muted)}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{padding:16px;background:var(--group);border-radius:9px}.service strong{display:block;color:var(--good);font-size:21px;margin:14px 0}.service button{border:1px solid var(--line);background:none;border-radius:5px;padding:4px 10px}.service small{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}.log{margin:0;padding:16px;white-space:pre-wrap;font:12px/1.8 ui-monospace,monospace;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.editor{max-width:720px;margin:auto}.editor h2{font-size:19px;margin:0 0 20px}.back{border:0;background:none;color:var(--blue);padding:4px 0;margin-bottom:18px}.primary{background:var(--select);color:#fff;border:0;border-radius:6px;padding:8px 18px}.secondary{background:var(--group);border:1px solid var(--line);border-radius:6px;padding:8px 18px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.field{display:block;margin-bottom:14px}.field input,.field select{display:block;width:100%;background:var(--group);border:1px solid var(--line);color:var(--ink);padding:9px;border-radius:5px;margin-top:6px}.dialog{border:1px solid var(--line);border-radius:12px;padding:24px;background:var(--canvas);color:var(--ink);width:min(480px,90vw)}.dialog::backdrop{background:#0008}.dialog h2{margin:0 0 12px;font-size:18px}.dialog p{color:var(--muted);font-size:13px}.hint{font-size:12px;color:var(--muted);margin:12px 2px}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}.details-grid dt,.details-grid dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}.details-grid dt{color:var(--muted)}.details-grid dd{text-align:right}.hidden{display:none!important}@media(max-width:850px){.shell{grid-template-columns:170px minmax(0,1fr)}.page{padding:18px 16px}.service-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.review span{display:none}.shell{grid-template-columns:116px minmax(0,1fr)}.sidebar{padding:18px 6px}.nav{gap:7px;padding:9px 7px;font-size:13px}.tools{flex-wrap:wrap}.tools input{width:100%;max-width:none}.service-grid,.metrics{grid-template-columns:1fr}.toolbar{grid-template-columns:48px minmax(0,1fr) 48px;padding:0 8px}.brand{padding:10px 5px}.node{padding-left:10px;gap:4px}.flag{width:20px;font-size:20px}.node .body{gap:8px}.delay{min-width:52px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body>
<div class="review"><b>U09 · 初稿归档</b><a href="u09-final.html">打开最终优化稿</a><span>合成数据 · 仅演示导航与交互，不连接内核或系统代理</span><button id="theme">切换浅色</button><a href="../ui-u09-shadowrocket.md">设计说明</a></div>
<div class="shell"><aside class="sidebar"><nav aria-label="主要页面"></nav><div class="brand">🐘 Mlash<br>桌面 UI 方案</div></aside>
<main class="main"><header class="toolbar"><button class="icon" id="leading" aria-label="导入配置"></button><h1 id="title">Mlash</h1><button class="icon right" id="add" aria-label="添加配置"></button></header><section id="page" class="page" tabindex="-1" aria-label="首页"></section><footer class="state"><span id="feedback" role="status" aria-live="polite">设计预览，未执行真实操作</span><span id="session">合成会话</span></footer></main></div>
<dialog id="dialog" class="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button class="secondary" id="dialogClose">关闭</button></div></dialog>
<script>
'use strict';
const paths={home:'M3 11 12 3 21 11M6 9v12h4v-6h4v6h4V9',folder:'M3 6h6l3 3h9v12H3z',data:'M2 12h5l2-8 4 16 3-11 2 3h4',settings:'M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1',plus:'M12 4v16M4 12h16',import:'M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5',route:'M5 21V3m0 2h12l4 4-4 4H5',gauge:'M4 19a10 10 0 1 1 16 0M12 14l5-6M7 19h10',info:'M12 10v7m0-11v1',refresh:'M20 8a8 8 0 1 0 0 8M20 3v5h-5',globe:'M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18',layers:'m3 7 9-5 9 5-9 5zM3 12l9 5 9-5M3 17l9 5 9-5',moon:'M20 15A9 9 0 0 1 9 3a9 9 0 0 0 11 12',more:'M4 12h.1m7.9 0h.1m7.9 0h.1',check:'m5 12 4 4L20 5',close:'m6 6 12 12M6 18 18 6'};
function icon(id){let shape='<path d="'+(paths[id]||paths.settings)+'"/>';if(id==='info'||id==='globe')shape='<circle cx="12" cy="12" r="9"/>'+shape;if(id==='settings')shape='<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'+shape;return '<svg aria-hidden="true" viewBox="0 0 24 24">'+shape+'</svg>'}
const page=document.getElementById('page'),title=document.getElementById('title'),dialog=document.getElementById('dialog');
const state={view:'home',tab:'traffic',connected:false,mode:'配置规则',current:'日本 · 示例线路 02',group:'示例节点组',query:'',theme:'dark',sort:'default',settings:{'关闭窗口时释放界面':true,'登录启动':false}};
const nodes=[['🇭🇰','香港 · 示例线路 01','Shadowsocks',86],['🇯🇵','日本 · 示例线路 02','VLESS · TLS',120],['🇸🇬','新加坡 · 示例线路 03','Trojan',163],['🇺🇸','美国 · 示例线路 04','VLESS · TLS',224],['🇩🇪','德国 · 示例线路 05','Shadowsocks',null],['🇬🇧','英国 · 示例线路 06','Trojan',192],['🌐','未知地区 · 示例节点','HTTP',null]];
const flagCodes=['HK','JP','SG','US','DE','GB'];
const views=[['home','home','首页'],['profiles','folder','配置'],['data','data','数据'],['settings','settings','设置']];
const labels=Object.fromEntries(views.map(v=>[v[0],v[2]]));
document.querySelector('nav').innerHTML=views.map(v=>'<button class="nav" data-view="'+v[0]+'">'+icon(v[1])+v[2]+'</button>').join('');
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
document.getElementById('leading').innerHTML=icon('import');document.getElementById('add').innerHTML=icon('plus');
document.getElementById('leading').onclick=addConfig;document.getElementById('add').onclick=addConfig;
document.getElementById('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;document.getElementById('theme').textContent=state.theme==='dark'?'切换浅色':'切换深色';};
document.getElementById('dialogClose').onclick=()=>dialog.close();
function feedback(text){document.getElementById('feedback').textContent=text+'（模拟）'}
function modal(name,body){document.getElementById('dialogTitle').textContent=name;document.getElementById('dialogBody').innerHTML=body;dialog.showModal()}
function row(id,glyph,name,value='',sub=''){return '<button class="row" data-action="'+id+'">'+icon(glyph)+'<span class="maintext"><span class="title">'+name+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</span>'+(value?'<span class="value">'+value+'</span>':'')+'<span class="chevron" aria-hidden="true">›</span></button>'}
function navigate(view){state.view=view;state.query='';render();page.focus()}
function render(){title.textContent=state.view==='home'?'Mlash':labels[state.view];page.setAttribute('aria-label',labels[state.view]);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false'));document.getElementById('leading').style.visibility=['home','profiles'].includes(state.view)?'visible':'hidden';document.getElementById('add').style.visibility=['home','profiles'].includes(state.view)?'visible':'hidden';if(state.view==='home')home();if(state.view==='profiles')profiles();if(state.view==='data')data();if(state.view==='settings')settings()}
function home(){page.innerHTML='<div class="group"><div class="row">'+icon('layers')+'<span class="maintext"><span class="title truncate">'+(state.connected?state.current:'未连接')+'</span><span class="sub">'+(state.connected?'系统代理已接管 · 示例配置':'选择配置和节点后开启系统代理')+'</span></span><button id="connect" class="switch" role="switch" aria-label="系统代理连接" aria-checked="'+state.connected+'"></button></div>'+row('mode','route','全局路由',state.mode)+'<div class="row">'+icon('gauge')+'<span class="maintext">连通性测试</span><button class="icon" id="probe" aria-label="测试当前节点连通性">'+icon('gauge')+'</button></div></div><div class="tools"><select class="group-select" aria-label="浏览策略组" id="group"><option>示例节点组</option><option>自动选择组</option></select><input id="search" aria-label="搜索节点" placeholder="搜索节点"><button class="icon" id="testAll" aria-label="测试本组">'+icon('gauge')+'</button><button class="icon" id="sort" aria-label="切换原始/名称/延迟排序">'+icon('route')+'</button></div><div id="nodeRows" class="group"></div><p class="hint">地区仅根据节点名称提示 · 延迟按钮可独立重测</p>';
document.getElementById('connect').onclick=()=>{state.connected=!state.connected;home();feedback(state.connected?'系统代理连接成功':'系统代理已关闭')};document.getElementById('probe').onclick=()=>feedback('连通性示例响应 138ms，未发送网络请求');page.querySelector('[data-action=mode]').onclick=chooseMode;document.getElementById('group').value=state.group;document.getElementById('group').onchange=e=>{state.group=e.target.value;drawNodes();feedback('已更换浏览组，运行成员未改变')};document.getElementById('search').oninput=e=>{state.query=e.target.value;drawNodes()};document.getElementById('sort').onclick=()=>{state.sort=state.sort==='default'?'delay':state.sort==='delay'?'name':'default';drawNodes();feedback('排序：'+({default:'原始',delay:'延迟',name:'名称'})[state.sort])};document.getElementById('testAll').onclick=()=>{feedback('整组测试交互示例，不发送请求');document.getElementById('nodeRows').querySelectorAll('.delay').forEach(b=>b.textContent='示例结果')};drawNodes()}
function drawNodes(){let list=nodes.filter(n=>n[1].includes(state.query));if(state.sort==='delay')list=list.slice().sort((a,b)=>(a[3]??Infinity)-(b[3]??Infinity));if(state.sort==='name')list=list.slice().sort((a,b)=>a[1].localeCompare(b[1]));document.getElementById('nodeRows').innerHTML='<div class="grouphead">'+icon('layers')+'<span>'+state.group+'</span><span class="sub">'+list.length+' 个成员</span></div>'+list.map(n=>'<div class="node"><button class="body" data-node="'+nodes.indexOf(n)+'"><span class="flag" aria-hidden="true">'+(flagCodes[nodes.indexOf(n)]?'<img width="26" height="26" style="object-fit:contain" alt="" src="../../resources/flags/'+flagCodes[nodes.indexOf(n)]+'.png">':icon('globe'))+'</span><span class="truncate"><span class="title truncate">'+n[1]+'</span><span class="sub">'+n[2]+(state.group==='自动选择组'?' · 自动策略，只读':'')+'</span></span></button><span class="check" aria-label="'+(state.current===n[1]?'当前节点':'')+'">'+(state.current===n[1]?'✓':'')+'</span><button class="delay '+(n[3]===null?'failed':'')+'" data-delay="'+nodes.indexOf(n)+'" aria-label="重新测试 '+n[1]+'">'+(n[3]===null?'未测试':n[3]+'ms')+'</button><button class="info" data-info="'+nodes.indexOf(n)+'" aria-label="查看 '+n[1]+' 详情">'+icon('info')+'</button></div>').join('');if(!list.length)document.getElementById('nodeRows').innerHTML+='<div class="empty">没有匹配节点，请调整搜索</div>';document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{if(state.group==='自动选择组'){details(nodes[+b.dataset.node]);return}state.current=nodes[+b.dataset.node][1];drawNodes();feedback('已切换示例成员')});document.querySelectorAll('[data-delay]').forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent='测试中';setTimeout(()=>{b.disabled=false;b.textContent='138ms';b.classList.remove('failed');feedback('单节点示例结果，不改变选择')},500)});document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>details(nodes[+b.dataset.info]))}
function details(n){page.innerHTML='<div class="editor"><button class="back" id="back">‹ 返回首页</button><h2>'+n[1]+'</h2><div class="group" style="padding:0 16px"><dl class="details-grid"><dt>协议</dt><dd>'+n[2]+'</dd><dt>地区提示</dt><dd>'+n[0]+' · 由名称推断</dd><dt>浏览组</dt><dd>'+state.group+'</dd><dt>当前成员</dt><dd>'+(state.current===n[1]?'是':'否')+'</dd></dl></div><p class="hint">只读详情，不展示服务器、密码或来源。预览数据全部为虚构。</p></div>';document.getElementById('back').onclick=home;page.focus()}
function chooseMode(){modal('全局路由','<p>只改变路由方式，不自动选择节点或开启连接。</p><div class="group">'+['配置规则','全局代理','全部直连'].map((m,i)=>row('mode'+i,'route',m,state.mode===m?'✓':'')).join('')+'</div>');dialog.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{state.mode=b.querySelector('.title').textContent;dialog.close();home();feedback('路由模式回读示例：'+state.mode)})}
function addConfig(){modal('添加配置','<p>确认前不下载，不激活配置。</p><div class="group">'+row('url','globe','订阅链接')+row('file','folder','配置文件')+row('nodes','layers','节点分享链接')+'</div>');dialog.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{dialog.close();modal('导入预览','<label class="field">名称<input value="示例配置" aria-label="配置名称"></label><label class="field">来源<input placeholder="https://example.invalid/profile.yaml" aria-label="配置来源"></label><p>设计占位：此预览不会读取剪贴板、文件或访问网址。</p>')})}
function profiles(){page.innerHTML='<div class="group">'+row('import','import','导入…')+row('update','refresh','更新订阅')+'</div><h2 class="section">远程订阅</h2><div class="group">'+row('profile','globe','示例配置','✓','远程订阅 · 刚刚更新 · 有候选待查看')+'</div><p class="caption">勾选表示当前配置，候选需要明确应用。</p><h2 class="section">本地配置</h2><div class="group">'+row('local','folder','离线示例.yaml','','文件快照 · 未使用')+'</div>';page.querySelector('[data-action=import]').onclick=addConfig;page.querySelector('[data-action=update]').onclick=()=>feedback('已生成候选示例，运行版未改变');page.querySelector('[data-action=profile]').onclick=()=>configuration(false);page.querySelector('[data-action=local]').onclick=()=>configuration(true)}
function configuration(local){page.innerHTML='<div class="editor"><button class="back" id="back">‹ 返回配置</button><h2>'+(local?'离线示例.yaml':'示例配置')+'</h2><p class="hint">'+(local?'未使用 · 本地文件快照':'正在使用 · 有候选待应用')+'</p><div class="group">'+row('changes','refresh',local?'使用此配置':'查看更新','',local?'明确确认后才切换':'当前运行版本保持')+row('rules','route','规则与分流')+row('dns','globe','DNS')+row('nodes','layers','节点与策略组')+row('source','folder','来源与维护')+'</div></div>';document.getElementById('back').onclick=profiles;page.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const key=b.dataset.action;if(key==='rules')rules();else if(key==='changes')modal('版本操作', '<p>这是对象明确的版本任务。真实产品须执行比较、校验、原子提交和回读，失败保留原版。</p>');else modal(b.querySelector('.title').textContent,'<p>详情入口示例。具体草稿、提交与校验按功能设计实施。</p>')})}
function rules(){page.innerHTML='<div class="editor"><button class="back" id="back">‹ 返回配置详情</button><h2>规则与分流</h2><p class="hint">对象：示例配置 · 运行版；保存不消耗独立候选。</p><div class="group">'+row('newRule','plus','添加自定义规则')+'<div class="row"><span class="maintext">example.invalid<span class="sub">域名后缀 · DOMAIN-SUFFIX</span></span><span class="value">直连</span></div></div><div class="actions"><button class="secondary" id="ruleCancel">取消</button><button class="primary" id="ruleSave">保存并校验</button></div></div>';document.getElementById('back').onclick=()=>configuration(false);document.getElementById('ruleCancel').onclick=()=>configuration(false);document.getElementById('ruleSave').onclick=()=>feedback('规则校验/保存示例，未写入配置');page.querySelector('[data-action]').onclick=()=>modal('添加规则','<p>选择类型、匹配值及目标后加入草稿。原始 YAML 保持独立。</p>')}
function data(){page.innerHTML='<div class="tabs" role="tablist" aria-label="数据任务">'+[['traffic','流量'],['connections','连接'],['tests','网站测试'],['logs','日志']].map(t=>'<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(state.tab===t[0])+'">'+t[1]+'</button>').join('')+'</div><div id="dataContent"></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;data();feedback('切换可见任务，其他页签停止采样')});const content=document.getElementById('dataContent');if(state.tab==='traffic')content.innerHTML='<div class="metrics"><div class="metric"><small>下载 · 合成数据</small><strong>1.24 MB/s</strong></div><div class="metric"><small>上传 · 合成数据</small><strong>82 KB/s</strong></div><div class="metric"><small>活动连接</small><strong>12</strong></div></div><p class="hint">仅用于呈现指标层级，无实时采样或模拟曲线。</p>';if(state.tab==='connections')content.innerHTML='<div class="group"><table><thead><tr><th>目标</th><th>命中规则</th><th>代理链</th><th>状态</th></tr></thead><tbody><tr><td>example.invalid:443</td><td>DOMAIN-SUFFIX</td><td>示例节点组</td><td>示例</td></tr><tr><td>local.example:80</td><td>DIRECT</td><td>直连</td><td>示例</td></tr></tbody></table></div><p class="hint">表格保留桌面字段对照能力，真实连接仅当前观察会话保留。</p>';if(state.tab==='tests'){content.innerHTML='<p class="hint">测试节点：'+state.current+' · 下列延迟均为设计样例</p><div class="service-grid">'+['YouTube','ChatGPT','Google','GitHub','Cloudflare','自定义目标'].map((n,i)=>'<div class="service"><span class="title">'+n+'</span><small>示例响应</small><strong>'+(120+i*17)+' ms</strong><button>重测</button></div>').join('')+'</div>';content.querySelectorAll('button').forEach(b=>b.onclick=()=>feedback('单卡重测示例，无网络请求'))}if(state.tab==='logs')content.innerHTML='<div class="group"><pre class="log">[示例] 内核就绪\n[示例] 模式回读完成\n[示例] 配置事务已提交</pre></div><p class="hint">真实日志须脱敏；查看历史时不强制滚回尾部。</p>'}
function settings(){page.innerHTML='<div class="group">'+row('appearance','moon','外观',state.theme==='dark'?'深色':'浅色')+row('text','settings','文字大小','100%')+'</div><h2 class="section">通用</h2><div class="group">'+row('startup','home','启动与托盘')+row('hotkeys','settings','快捷键')+toggleRow('关闭窗口时释放界面')+toggleRow('登录启动')+'</div><h2 class="section">连接与网络</h2><div class="group">'+row('network','route','本地代理','端口 17890')+row('tun','layers','TUN 虚拟网卡','未启用')+row('bypass','globe','系统代理排除')+'</div><h2 class="section">维护与数据</h2><div class="group">'+row('core','layers','内核管理','固定补丁内核')+row('backup','folder','备份与恢复')+row('geo','globe','Geo 数据')+row('diagnostic','gauge','诊断')+'</div><h2 class="section">关于</h2><div class="group">'+row('about','info','Mlash','设计提案')+'</div>';page.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>settingDetail(b.dataset.action,b.querySelector('.title').textContent));page.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{state.settings[b.dataset.toggle]=!state.settings[b.dataset.toggle];settings();feedback('偏好提交示例')})}
function toggleRow(name){return '<div class="row">'+icon('settings')+'<span class="maintext">'+name+'</span><button class="switch" role="switch" aria-label="'+name+'" aria-checked="'+state.settings[name]+'" data-toggle="'+name+'"></button></div>'}
function settingDetail(key,name){if(key==='appearance'){document.getElementById('theme').click();settings();return}if(key==='network'){page.innerHTML='<div class="editor"><button class="back" id="back">‹ 返回设置</button><h2>本地代理</h2><label class="field">HTTP / SOCKS5 共用端口<input value="17890" type="number" min="1024" max="65535"></label><p class="hint">保存将校验并安全重启内核。失败保留原运行配置与草稿。</p><div class="actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="save">保存并重启</button></div></div>';document.getElementById('back').onclick=settings;document.getElementById('cancel').onclick=settings;document.getElementById('save').onclick=()=>feedback('网络设置事务示例，未重启任何进程');return}modal(name,key==='tun'?'<p>TUN 和系统代理分别表达。安装需要明确授权；真实服务、固定内核、路由恢复由已有 C++ 协议负责。</p>':'<p>设置详情/工具入口。预览演示层级，不执行真实设置、备份或文件操作。</p>')}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='f'){const s=document.getElementById('search');if(s){e.preventDefault();s.focus()}}});render();
</script></body></html>
