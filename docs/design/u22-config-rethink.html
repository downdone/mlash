<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mlash · 配置工作台设计提案</title>
<style>
  :root { font-family: "Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif; color:#172232; background:#e8ebf0; font-size:14px; }
  * { box-sizing:border-box; }
  body { margin:0; }
  button,input,select { font:inherit; }
  button { cursor:pointer; }
  .app { display:flex; flex-direction:column; min-width:720px; height:100vh; min-height:620px; background:#fff; overflow:hidden; }
  .chrome { height:38px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 15px; color:#647182; background:#f7f8fa; border-bottom:1px solid #e6e9ee; font-size:12px; }
  .chrome strong { color:#2b394c; font-weight:600; letter-spacing:.01em; }
  .chrome .window-controls { display:flex; gap:20px; align-items:center; color:#5a687a; font-size:14px; }
  .shell { flex:1; min-height:0; display:flex; }
  .sidebar { width:256px; flex:none; display:flex; flex-direction:column; padding:24px 14px 15px; background:#f3f5f8; border-right:1px solid #e3e8ef; }
  .brand { display:flex; align-items:center; gap:11px; padding:0 12px 30px; font-size:21px; font-weight:700; letter-spacing:-.025em; }
  .brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:9px; background:#176bca; color:white; font-size:18px; font-weight:700; }
  .primary-nav { display:flex; flex-direction:column; gap:8px; }
  .nav-item { width:100%; height:50px; border:0; border-radius:11px; background:transparent; color:#445368; display:flex; align-items:center; gap:14px; padding:0 15px; text-align:left; font-size:15px; font-weight:500; transition:background .12s ease; }
  .nav-item:hover { background:#e8edf4; }
  .nav-item.active { background:#dfeeff; color:#075baa; font-weight:650; }
  .nav-icon { width:22px; height:22px; display:grid; place-items:center; }
  .nav-icon svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .sidebar-foot { flex:none; margin-top:15px; padding:13px 12px 2px; border-top:1px solid #dce3ec; color:#8390a0; font-size:12px; }
  .sidebar-foot b { display:block; color:#4b5c70; font-size:13px; font-weight:550; margin-bottom:3px; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; background:#fff; }
  .pagebar { min-height:104px; flex:none; display:flex; justify-content:space-between; align-items:center; gap:20px; padding:20px 34px; border-bottom:1px solid #e8ecf1; }
  .toolbar { display:flex; align-items:center; gap:9px; }
  .button { border:1px solid #d9e1ea; border-radius:9px; background:#fff; color:#31506d; min-height:35px; padding:0 13px; font-size:13px; font-weight:550; white-space:nowrap; }
  .button:hover { background:#f4f8fc; border-color:#a8c9eb; }
  .button.primary { color:#fff; background:#0869c4; border-color:#0869c4; box-shadow:0 1px 2px #083d721b; }
  .button.primary:hover { background:#075db0; }
  .button.quiet { border-color:transparent; background:transparent; color:#5e7186; }
  .button.quiet:hover { background:#edf3fa; }
  .icon-button { width:35px; padding:0; font-size:20px; font-weight:400; line-height:1; }
  .workspace { min-height:0; flex:1; display:flex; }
  .library { flex:1; min-height:0; overflow:auto; margin-top:26px; padding-right:2px; }
  .library-head { display:flex; align-items:center; justify-content:space-between; padding:0 7px; margin-bottom:11px; }
  .library-head h2 { margin:0; font-size:13px; font-weight:700; color:#5c6b7d; }
  .count { font-size:12px; color:#8693a3; }
  .search { width:100%; height:35px; border:1px solid #dfe5ec; border-radius:9px; outline:none; padding:0 12px; background:white; color:#263549; }
  .search:focus { border-color:#6ea9e8; box-shadow:0 0 0 3px #2788e518; }
  .section { margin:22px 8px 7px; color:#8b97a7; font-size:11px; font-weight:700; letter-spacing:.04em; }
  .source { width:100%; display:flex; align-items:center; gap:11px; border:1px solid transparent; border-radius:10px; background:transparent; padding:10px 11px; text-align:left; min-height:61px; }
  .source:hover { background:#f0f4f8; }
  .source.active { background:#eaf3ff; border-color:#d4e7fc; }
  .source-badge { width:29px; height:29px; flex:none; display:grid; place-items:center; border-radius:8px; background:#e7edf5; color:#457399; font-size:15px; }
  .source.active .source-badge { background:#d6e9ff; color:#0869c4; }
  .source-copy { min-width:0; flex:1; }
  .source-name { display:flex; justify-content:space-between; align-items:center; gap:5px; font-weight:600; color:#263547; font-size:13px; }
  .source-sub { margin-top:4px; color:#8390a0; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .using-dot { width:7px; height:7px; flex:none; border-radius:50%; background:#138052; }
  .detail { min-width:0; flex:1; overflow:auto; }
  .pagebar h1 { display:flex; align-items:center; gap:10px; margin:0; font-size:24px; font-weight:680; letter-spacing:-.035em; }
  .chip { border-radius:99px; background:#eaf6ee; color:#137449; font-size:11px; padding:4px 9px; font-weight:620; letter-spacing:0; }
  .chip.candidate { background:#fff4df; color:#926413; }
  .object-sub { margin:8px 0 0; color:#8190a1; font-size:12px; }
  .object-actions { display:flex; gap:8px; align-items:center; }
  .viewbar { display:flex; gap:3px; align-items:flex-end; padding:0 29px; border-bottom:1px solid #e6ebf1; min-height:44px; }
  .view { border:0; background:transparent; color:#64748a; min-height:43px; padding:0 15px; border-bottom:2px solid transparent; white-space:nowrap; font-size:13px; font-weight:550; }
  .view:hover { color:#1b5eaa; }
  .view.active { color:#085eaf; border-bottom-color:#0869c4; font-weight:680; }
  .content { padding:25px 34px 50px; max-width:1100px; }
  .content-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; }
  .content-head h3 { font-size:18px; margin:0 0 5px; font-weight:680; }
  .muted { color:#8190a1; font-size:12px; line-height:1.5; }
  .mini-toolbar { display:flex; gap:8px; }
  .list { border:1px solid #e2e8ef; border-radius:11px; overflow:hidden; background:#fff; }
  .list-row { display:flex; align-items:center; min-height:58px; padding:0 16px; gap:13px; border-bottom:1px solid #edf0f4; }
  .list-row:last-child { border-bottom:0; }
  .list-row:hover { background:#f8fafc; }
  .flag { width:28px; height:28px; display:grid; place-items:center; font-size:20px; }
  .row-main { flex:1; min-width:0; }
  .row-title { font-weight:570; }
  .row-sub { color:#8a97a6; font-size:11px; margin-top:3px; }
  .pill { color:#147145; background:#e9f6ee; border-radius:99px; padding:4px 9px; font-size:11px; }
  .row-action { border:0; background:transparent; color:#637b93; font-size:18px; padding:6px; border-radius:6px; }
  .row-action:hover { background:#e9f2fd; color:#0869c4; }
  .callout { display:flex; gap:11px; align-items:flex-start; border:1px solid #d9e8f8; background:#f5f9ff; border-radius:10px; padding:13px 15px; color:#41617d; font-size:12px; line-height:1.5; margin-bottom:17px; }
  .callout b { color:#1c5c9d; }
  .group-label { margin:22px 0 9px; font-size:12px; color:#7a899b; font-weight:660; }
  .form-card { border:1px solid #e2e8ef; border-radius:11px; overflow:hidden; }
  .form-row { display:flex; align-items:center; justify-content:space-between; gap:25px; padding:15px 17px; min-height:56px; border-bottom:1px solid #edf0f4; }
  .form-row:last-child { border-bottom:0; }
  .form-row strong { display:block; font-size:13px; font-weight:600; }
  .form-row small { display:block; color:#8a97a6; margin-top:3px; font-size:11px; }
  .toggle { width:39px; height:23px; border:0; background:#a6b2bf; border-radius:20px; padding:3px; }
  .toggle::after { content:""; display:block; background:#fff; width:17px; height:17px; border-radius:50%; transition:transform .14s ease; box-shadow:0 1px 2px #14213330; }
  .toggle.on { background:#096cc5; }
  .toggle.on::after { transform:translateX(16px); }
  .editor-row { padding:16px 17px; }
  .editor-row label { display:block; font-size:12px; font-weight:650; margin-bottom:8px; }
  textarea { width:100%; height:110px; resize:vertical; border:1px solid #dbe3ed; border-radius:8px; padding:10px; outline:none; color:#263547; }
  textarea:focus { border-color:#6ea9e8; box-shadow:0 0 0 3px #2788e518; }
  .savebar { display:flex; justify-content:space-between; align-items:center; margin-top:16px; color:#7d8b9c; font-size:12px; }
  .savebar .buttons { display:flex; gap:8px; }
  .status { min-height:32px; border-top:1px solid #e8ecf1; background:#fafbfc; display:flex; align-items:center; padding:0 19px; color:#8b97a5; font-size:11px; }
  .popover { position:absolute; z-index:5; background:white; border:1px solid #dfe6ef; border-radius:10px; box-shadow:0 12px 28px #263e5b25; padding:5px; min-width:170px; }
  .popover.hidden { display:none; }
  .popover button { display:block; width:100%; padding:9px 11px; text-align:left; border:0; border-radius:6px; background:transparent; color:#314154; font-size:12px; }
  .popover button:hover { background:#eff5fd; }
  @media(max-width:950px) {
    .sidebar { width:228px; }
    .content { padding:22px 25px; }
    .viewbar { padding:0 19px; }
    .pagebar { padding:0 25px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="chrome"><strong>Mlash · 设计提案</strong><span class="window-controls" aria-hidden="true">—　□　×</span></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">M</span>Mlash</div>
      <nav class="primary-nav" aria-label="一级导航">
        <button class="nav-item" data-nav="首页"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></span>首页</button>
        <button class="nav-item active" data-nav="配置"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7"/></svg></span>配置</button>
        <button class="nav-item" data-nav="数据"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M2 13h4l2-6 4 11 3-8 2 3h5"/></svg></span>数据</button>
        <button class="nav-item" data-nav="设置"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 2h4l.5 2.3 2.1.9 2-1.2 2.8 2.8-1.2 2 .9 2.1L23 11v4l-2.3.5-.9 2.1 1.2 2-2.8 2.8-2-1.2-2.1.9L14 24h-4l-.5-2.3-2.1-.9-2 1.2-2.8-2.8 1.2-2-.9-2.1L1 15v-4l2.3-.5.9-2.1-1.2-2 2.8-2.8 2 1.2 2.1-.9z" transform="translate(0 -1) scale(.92)"/><circle cx="12" cy="12" r="3"/></svg></span>设置</button>
      </nav>
      <section class="library" id="library">
        <div class="library-head"><h2>配置来源</h2><button class="button quiet icon-button" id="importButton" aria-label="导入配置">＋</button></div>
        <input class="search" id="profileSearch" placeholder="搜索配置" aria-label="搜索配置">
        <div class="section">远程订阅</div>
        <div id="remoteSources"></div>
        <div class="section">本地配置</div>
        <div id="localSources"></div>
      </section>
      <div class="sidebar-foot"><b>工作区导航</b>当前版本仅演示配置页交互</div>
    </aside>
    <main class="main">
      <header class="pagebar">
        <div><h1><span id="profileTitle"></span><span class="chip" id="profileChip"></span></h1><p class="object-sub" id="profileSub"></p></div>
        <div class="object-actions"><button class="button" id="updateButton">检查更新</button><button class="button primary" id="useButton">设为当前</button><button class="button quiet icon-button" id="moreButton" aria-label="更多配置操作">⋯</button></div>
      </header>
      <div class="workspace" id="workspace">
        <section class="detail">
          <nav class="viewbar" id="viewbar" aria-label="配置内容视角"></nav>
          <div class="content" id="content"></div>
        </section>
      </div>
      <div class="status" id="status">原型只模拟界面，不连接内核，也不写入配置。</div>
    </main>
  </div>
</div>
<div class="popover hidden" id="popover"></div>
<script>
const profiles=[
 {name:"日常订阅",kind:"remote",stamp:"今天 09:08 更新",used:true,candidate:false,nodes:145,groups:22},
 {name:"备用订阅",kind:"remote",stamp:"昨天 18:30 更新",used:false,candidate:false,nodes:42,groups:6},
 {name:"本地测试",kind:"local",stamp:"本地 YAML 文件",used:false,candidate:false,nodes:8,groups:2}
];
const views=["节点与组","规则","DNS","拨号链","来源与更新"];
const state={selected:0,view:"节点与组",sourceFilter:""};
const drafts=profiles.map(()=>({dnsCustom:false,dnsDirty:false,dnsText:""}));
const requestedView=new URLSearchParams(location.search).get("view");
if(views.includes(requestedView))state.view=requestedView;
const $=id=>document.getElementById(id);
function note(message){$("status").textContent=message;}
function sourceButton(profile,index){
 const el=document.createElement("button");el.className="source"+(state.selected===index?" active":"");
 el.innerHTML='<span class="source-badge">'+(profile.kind==="remote"?"☁":"▤")+'</span><span class="source-copy"><span class="source-name">'+profile.name+(profile.used?'<i class="using-dot" title="当前使用"></i>':"")+'</span><span class="source-sub">'+profile.stamp+'</span></span>';
 el.onclick=()=>selectProfile(index);return el;
}
function selectProfile(index){
 if(drafts[state.selected].dnsDirty)note("已将 DNS 草稿留在原配置；返回后可继续编辑。");
 state.selected=index;render();
}
function renderSources(){
 $("remoteSources").replaceChildren();$("localSources").replaceChildren();
 profiles.forEach((p,i)=>{if(!p.name.includes(state.sourceFilter))return;$(p.kind==="remote"?"remoteSources":"localSources").append(sourceButton(p,i));});
}
function renderHeader(){
 const p=profiles[state.selected];$("profileTitle").textContent=p.name;
 $("profileChip").textContent=p.candidate?"更新待应用":p.used?"当前使用":"未使用";
 $("profileChip").classList.toggle("candidate",p.candidate);
 $("profileSub").textContent=(p.kind==="remote"?"远程订阅":"本地文件")+" · "+p.stamp+" · "+p.nodes+" 节点 / "+p.groups+" 策略组";
 $("updateButton").style.display=p.kind==="remote"?"":"none";
 $("useButton").style.display=(p.used&&!p.candidate)?"none":"";
 $("useButton").textContent=p.candidate?"应用更新":"设为当前";
 $("viewbar").innerHTML=views.map(v=>'<button class="view'+(state.view===v?" active":"")+'" data-view="'+v+'">'+v+'</button>').join("");
 $("viewbar").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});
}
function row(icon,title,sub,end){
 return '<div class="list-row"><span class="flag">'+icon+'</span><span class="row-main"><div class="row-title">'+title+'</div><div class="row-sub">'+sub+'</div></span>'+end+'</div>';
}
function contentNodes(p){
 return '<div class="content-head"><div><h3>节点与组</h3><div class="muted">直接查看此配置的内容；日常选节点仍在首页。</div></div><div class="mini-toolbar"><button class="button" data-action="node">添加节点</button><button class="button quiet" data-action="group">管理策略组</button></div></div>'+
 '<div class="group-label">策略组 · '+p.groups+' 个</div><div class="list">'+row("◇","自动选择","按延迟选择可用节点",'<span class="muted">12 个成员</span><button class="row-action" data-action="row">⋯</button>')+row("◇","手动选择","当前使用的成员由内核回读",'<span class="muted">12 个成员</span><button class="row-action" data-action="row">⋯</button>')+'</div>'+
 '<div class="group-label">节点 · '+p.nodes+' 个</div><div class="list">'+row("🇯🇵","日本 · 01","VLESS / TLS",'<span class="pill">可用</span><button class="row-action" data-action="row">⋯</button>')+row("🇭🇰","香港 · 02","Shadowsocks",'<span class="pill">可用</span><button class="row-action" data-action="row">⋯</button>')+row("🇸🇬","新加坡 · 03","VLESS / TLS",'<span class="muted">未测试</span><button class="row-action" data-action="row">⋯</button>')+'</div>';
}
function contentRules(){
 return '<div class="content-head"><div><h3>规则</h3><div class="muted">来源规则只读；自定义规则明确作为覆盖保存。</div></div><button class="button" data-action="rule">添加覆盖规则</button></div>'+
 '<div class="callout"><b>来源与覆盖分开</b><span>此处展示当前配置的规则。编辑不会修改原始订阅，保存后生成新的运行候选。</span></div>'+
 '<div class="group-label">自定义覆盖 · 2 条</div><div class="list">'+row("↪","DOMAIN-SUFFIX,example.org,DIRECT","优先规则 · 可编辑",'<button class="row-action" data-action="row">⋯</button>')+row("↪","PROCESS-NAME,example.exe,REJECT","优先规则 · 可编辑",'<button class="row-action" data-action="row">⋯</button>')+'</div>'+
 '<div class="group-label">订阅原规则 · 326 条</div><div class="list">'+row("▤","来源规则预览","只读 · 点击查看完整列表",'<button class="row-action" data-action="row">›</button>')+'</div>';
}
function contentDns(){
 const draft=drafts[state.selected];
 return '<div class="content-head"><div><h3>DNS</h3><div class="muted">默认沿用订阅；只有需要修改时才出现字段。</div></div><button class="button quiet" data-action="source">查看来源 DNS</button></div>'+
 '<div class="form-card"><div class="form-row"><div><strong>自定义 DNS</strong><small>'+(draft.dnsCustom?"保存后覆盖此配置的 DNS":"当前沿用订阅提供的 DNS")+'</small></div><button class="toggle'+(draft.dnsCustom?" on":"")+'" id="dnsToggle" aria-label="自定义 DNS" aria-pressed="'+draft.dnsCustom+'"></button></div>'+
 (draft.dnsCustom?'<div class="editor-row"><label for="dnsServers">上游 DNS · 每行一个</label><textarea id="dnsServers" placeholder="https://dns.example/dns-query"></textarea><div class="muted">复杂字段可在本视角的“高级 YAML”中按需展开。</div></div>':"")+'</div>'+
 (draft.dnsCustom?'<div class="savebar"><span>'+(draft.dnsDirty?"有未保存修改":"未修改")+'</span><div class="buttons"><button class="button" id="dnsCancel">取消</button><button class="button primary" id="dnsSave">保存 DNS</button></div></div>':"");
}
function contentChain(){
 return '<div class="content-head"><div><h3>拨号链</h3><div class="muted">仅在此配置需要特殊拨号时修改。</div></div><button class="button" data-action="chain">添加链</button></div>'+
 '<div class="list">'+row("⌁","当前没有自定义拨号链","订阅中的节点仍按原设置连接",'<button class="row-action" data-action="chain">添加</button>')+'</div>';
}
function contentSource(p){
 return '<div class="content-head"><div><h3>来源与更新</h3><div class="muted">管理来源、候选与回滚；不会静默替换正在运行的版本。</div></div></div>'+
 '<div class="form-card">'+
 '<div class="form-row"><div><strong>来源</strong><small>'+(p.kind==="remote"?"远程订阅地址已保存，敏感参数不在页面直接展示":"本地文件快照")+'</small></div><button class="button quiet" data-action="source">查看</button></div>'+
 '<div class="form-row"><div><strong>最近检查</strong><small>'+p.stamp+'</small></div><span class="muted">'+(p.candidate?"有候选待应用":"无待处理更新")+'</span></div>'+
 '<div class="form-row"><div><strong>上次可用版本</strong><small>更新失败时可恢复</small></div><button class="button quiet" data-action="history">版本记录 ›</button></div></div>';
}
function renderContent(){
 const p=profiles[state.selected];
 $("content").innerHTML=state.view==="节点与组"?contentNodes(p):state.view==="规则"?contentRules():state.view==="DNS"?contentDns():state.view==="拨号链"?contentChain():contentSource(p);
 $("content").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>note("原型仅演示操作位置："+b.textContent.trim()+"；产品实现需保留草稿、回读和失败状态。"));
 if(state.view==="DNS"){
  const draft=drafts[state.selected];
  $("dnsToggle").onclick=()=>{draft.dnsCustom=!draft.dnsCustom;draft.dnsDirty=true;renderContent();};
  if(draft.dnsCustom){$("dnsServers").value=draft.dnsText;
   $("dnsServers").oninput=e=>{draft.dnsText=e.target.value;draft.dnsDirty=true;$("content").querySelector(".savebar span").textContent="有未保存修改";};
   $("dnsCancel").onclick=()=>{draft.dnsCustom=false;draft.dnsDirty=false;draft.dnsText="";renderContent();note("已放弃本次 DNS 草稿。");};
   $("dnsSave").onclick=()=>{draft.dnsDirty=false;renderContent();note("原型：保存位置与反馈示意，未写入真实配置。");};}
 }
}
function render(){renderSources();renderHeader();renderContent();}
function popup(anchor,items){
 const menu=$("popover");menu.innerHTML="";items.forEach(item=>{const b=document.createElement("button");b.textContent=item[0];b.onclick=()=>{menu.classList.add("hidden");item[1]();};menu.append(b);});
 const box=anchor.getBoundingClientRect();menu.style.top=Math.min(window.innerHeight-25-items.length*37,box.bottom+5)+"px";menu.style.left=Math.max(8,Math.min(window.innerWidth-188,box.left))+"px";menu.classList.remove("hidden");
}
$("importButton").onclick=e=>popup(e.currentTarget,[["订阅地址",()=>note("原型：在配置页就近填写订阅地址。")],["本地 YAML 文件",()=>note("原型：调用系统文件选择器。")],["节点分享链接",()=>note("原型：在配置页就近粘贴链接。")]]);
$("moreButton").onclick=e=>popup(e.currentTarget,[["重命名配置",()=>note("原型：在对象标题旁就地修改名称。")],["版本记录",()=>{state.view="来源与更新";render();}],["删除配置…",()=>note("危险操作在真实产品中需要明确确认。")]]);
$("updateButton").onclick=()=>{profiles[state.selected].candidate=true;render();note("原型：已产生候选，运行配置尚未改变。");};
$("useButton").onclick=()=>{
 const p=profiles[state.selected];if(p.candidate){p.candidate=false;note("原型：候选已应用，实际产品须等待 Controller 回读。");}else{profiles.forEach(x=>x.used=false);p.used=true;note("原型：已选择此配置；实际产品须等待 Controller 回读。");}render();
};
$("profileSearch").oninput=e=>{state.sourceFilter=e.target.value.trim();renderSources();};
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x===b));if(b.dataset.nav!=="配置"){note("本原型聚焦配置页；点击「配置」返回工作台。");$("workspace").style.opacity=".35";$("library").style.visibility="hidden";}else{$("workspace").style.opacity="1";$("library").style.visibility="visible";note("配置工作台：来源与内容同时可见。");}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("popover").classList.add("hidden");});
document.addEventListener("click",e=>{if(!$("popover").contains(e.target)&&!e.target.closest("#importButton,#moreButton"))$("popover").classList.add("hidden");});
render();
</script>
</body>
</html>
