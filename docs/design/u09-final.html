const state={view:'home',sub:'',tab:'traffic',scenario:'running',connected:true,mode:'配置规则',current:'jp',group:'main',search:'',sort:'default',onlyFavorites:false,favorites:new Set(['jp']),recentGroups:['main'],testUrl:'https://www.gstatic.com/generate_204',groupUrls:{},testRun:0,delayFresh:true,profile:'remote',detailProfile:'remote',generation:1,pending:null,paused:false,connFilter:'active',networkPort:17890,lightweight:true,autoStart:false,theme:'dark',scale:100,draftRule:null,ruleDirty:false,simulationFailure:false,inspector:null};
const $=id=>document.getElementById(id),page=$('page'),dialog=$('dialog');let returnFocus=null;let inspectorFocus=null;let timer=null;
function node(){return nodes.find(n=>n.id===state.current)}function group(){return groups.find(g=>g.id===state.group)}function profile(){return profiles.find(p=>p.id===state.detailProfile)}
function status(text){$('message').textContent=text+' · 演示';$('message').title=text;}
function row(action,glyph,title,value='',sub='',extra=''){return '<button class="action-row" data-action="'+action+'" '+extra+'>'+icon(glyph)+'<span class="row-body"><span class="row-title">'+escape(title)+'</span>'+(sub?'<span class="row-sub">'+escape(sub)+'</span>':'')+'</span>'+(value?'<span class="row-value">'+escape(value)+'</span>':'')+icon('chevron','chevron')+'</button>'}
function section(title,body){return '<h2 class="section-label">'+escape(title)+'</h2><div class="group">'+body+'</div>'}
function back(action,label){return '<button class="back" data-action="'+action+'">'+icon('chevron')+escape(label)+'</button>'}
function button(action,label,cls='secondary',extra=''){return '<button class="'+cls+'" data-action="'+action+'" '+extra+'>'+escape(label)+'</button>'}
function tool(action,glyph,label,extra=''){return '<button class="icon-button" data-action="'+action+'" aria-label="'+escape(label)+'" title="'+escape(label)+'" '+extra+'>'+icon(glyph)+'</button>'}
function kv(items){return '<dl class="kv">'+items.map(([k,v])=>'<dt>'+escape(k)+'</dt><dd>'+escape(v)+'</dd>').join('')+'</dl>'}
function showDialog(title,body){if(!dialog.open)returnFocus=document.activeElement;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;if(!dialog.open)dialog.showModal();}
function closeDialog(){if(dialog.open)dialog.close();if(returnFocus?.isConnected)returnFocus.focus();}
function choice(action,title,selected=false,subtitle='',extra=''){return '<button class="choice" data-action="'+action+'" '+extra+'><span>'+escape(title)+(subtitle?'<small>'+escape(subtitle)+'</small>':'')+'</span><span class="check">'+(selected?'✓':'')+'</span></button>'}
function updateNavigation(){document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===state.view?'page':'false'));$('title').textContent=state.view==='home'?'Mlash':({profiles:'配置',data:'数据',settings:'设置'})[state.view];page.setAttribute('aria-label',$('title').textContent);$('leading').hidden=!['home','profiles'].includes(state.view);$('trailing').hidden=!['home','profiles'].includes(state.view);$('alarm').textContent=state.scenario==='error'?'恢复失败 · 需要处理':state.scenario==='external'?'系统代理由其他程序管理':'';}
function render(){updateNavigation();if(state.view==='home')renderHome();if(state.view==='profiles')renderProfiles();if(state.view==='data')renderData();if(state.view==='settings')renderSettings();}
function navigate(view){closeInspector();state.view=view;state.sub='';state.search='';render();page.focus();}
function renderHome(){const isEmpty=state.scenario==='empty';page.innerHTML='<div class="group"><div class="action-row">'+icon('rocket')+'<span class="row-body"><span class="row-title">'+escape(state.connected?node().name:'未连接')+'</span><span class="row-sub">'+escape(state.pending|| (state.scenario==='external'?'外部系统代理 · 开启前需要确认接管':state.scenario==='error'?'恢复记录保留，请先处理冲突':state.connected?'系统代理已接管 · '+profiles.find(p=>p.id===state.profile).name:'系统代理未开启'))+'</span></span><button class="switch" role="switch" aria-label="系统代理连接" aria-checked="'+state.connected+'" data-action="connect" '+(state.pending?'disabled':'')+'></button></div>'+row('mode','route','全局路由',state.mode)+'<div class="action-row">'+icon('gauge')+'<span class="row-body">连通性测试</span><button class="icon-button" data-action="probe" aria-label="测试当前节点连通性">'+icon('gauge')+'</button></div></div>'+(isEmpty?'<div class="empty">'+icon('folder')+'<p>还没有配置</p><p>导入订阅或本地配置后，选择节点并连接。</p>'+button('add','导入配置','primary')+'</div>':'<div class="tools"><button class="group-picker" data-action="groups">'+icon('layers')+escape(group().name)+icon('chevron','chevron')+'</button><input id="node-search" value="'+escape(state.search)+'" placeholder="搜索节点" aria-label="搜索节点">'+tool('locate','locate','定位当前成员')+tool('test-all','gauge','测试本组')+tool('node-more','more','排序与本组设置')+'</div><div id="filter-note"></div><div id="node-list" class="group"></div><p class="caption">'+(group().automatic?'自动策略由内核选路；点击成员只查看详情。':'点击节点切换，延迟单独重测，ⓘ 查看详情。')+'</p>');if(!isEmpty)drawNodes();}
function drawNodes(){if(!$('node-list'))return;let list=nodes.filter(n=>n.name.toLowerCase().includes(state.search.toLowerCase())&&(!state.onlyFavorites||state.favorites.has(n.id)));if(state.sort==='name')list=list.slice().sort((a,b)=>a.name.localeCompare(b.name));if(state.sort==='delay')list=list.slice().sort((a,b)=>(a.delay??Infinity)-(b.delay??Infinity));$('filter-note').innerHTML=(state.search||state.onlyFavorites)?'<div class="filter-note">'+list.length+' / '+nodes.length+' 个成员'+button('clear-filter','清除筛选','link')+'</div>':'';$('node-list').innerHTML='<div class="node-group-title">'+icon('layers')+'<span class="row-body"><span class="row-title">'+escape(group().name)+'</span><span class="row-sub">当前 → '+escape(node().name)+'</span></span><small>'+list.length+' 个成员</small>'+tool('test-settings','settings','本组测试目标')+'</div>'+list.map(n=>'<div class="node '+(state.current===n.id?'current':'')+'" id="node-'+n.id+'"><button class="node-select" data-action="select-node" data-id="'+n.id+'" aria-label="'+escape(group().automatic?'查看 '+n.name:'切换到 '+n.name)+'">'+(flagImages[n.code]?'<img class="flag" alt="" src="'+flagImages[n.code]+'">':icon('globe','flag'))+'<span class="row-body"><span class="name">'+escape(n.name)+(state.favorites.has(n.id)?'<span class="tag" aria-label="已收藏">☆</span>':'')+'</span><span class="row-sub">'+escape(n.type)+(group().automatic?' · 自动选路':'')+'</span></span></button><span class="check" aria-label="'+(state.current===n.id?'当前成员':'')+'">'+(state.current===n.id?icon('check'):'')+'</span><button class="delay '+(n.delay===null?'unknown':'')+'" data-action="test-node" data-id="'+n.id+'" aria-label="重测 '+escape(n.name)+'" title="'+escape(state.testUrl)+' · '+(state.delayFresh?'示例本轮':'已过期')+'">'+(n.delay===null?'未测试':n.delay+'ms')+(state.delayFresh?'':' · 旧')+'</button><button class="info" data-action="node-info" data-id="'+n.id+'" aria-label="'+escape(n.name)+' 详情">'+icon('info')+'</button></div>').join('')+(!list.length?'<div class="empty">没有匹配节点，请调整搜索或筛选。</div>':'');}
function groupsDialog(){showDialog('浏览策略组','<input id="group-search" placeholder="搜索策略组" aria-label="搜索策略组" style="width:100%"><p class="menu-heading">常用 / 最近</p><div id="group-choices">'+groups.map(g=>choice('choose-group',g.name,state.group===g.id,g.automatic?'自动策略 · 不手动固定':'手动选择', 'data-id="'+g.id+'"')).join('')+'</div><p class="caption">只更换浏览组，不切换当前节点或运行配置。</p>');}
function nodeMenu(){showDialog('节点显示与测试','<p class="menu-heading">排序方式</p>'+[['default','默认顺序'],['name','按名称'],['delay','按延迟']].map(([v,n])=>choice('sort',n,state.sort===v,'','data-id="'+v+'"')).join('')+'<p class="menu-heading">筛选与工具</p>'+choice('favorites','仅收藏',state.onlyFavorites)+choice('test-settings','本组测试设置',false,state.testUrl)+choice('groups','切换浏览组')+'<p class="caption">排序和筛选不会改变运行成员。</p>');}
function testSettings(){showDialog('本组测试设置','<label class="field">测试目标<input id="test-url" type="url" value="'+escape(state.testUrl)+'"></label><p class="caption">本组独立目标。修改后原延迟标为过期，不会自动发起网络请求。</p>'+button('save-test-url','保存设置','primary'));}
function locateCurrent(){if(!$('node-'+state.current)){showDialog('当前成员被筛选隐藏','<p class="caption">是否清除筛选并定位当前成员？不会切换节点。</p>'+button('reveal-current','清除筛选并定位','primary'));return;}const target=$('node-'+state.current);target.scrollIntoView({block:'center'});target.classList.add('flash');status('已定位当前组的实际成员，未切换节点');}
function showNodeInfo(id){const n=nodes.find(n=>n.id===id);openInspector('node',id,escape(n.name),'<p class="caption">位置依据名称提示，不是 IP 定位。</p><div class="group">'+kv([['协议',n.type],['浏览组',group().name],['实际当前',state.current===id?'是':'否'],['测试目标',state.testUrl],['延迟',n.delay===null?'未测试':n.delay+'ms · 示例'],['新鲜度',state.delayFresh?'示例本轮':'旧目标结果，已过期']])+'</div>'+section('操作',row('favorite-node','star',state.favorites.has(id)?'取消收藏':'收藏节点','','','data-id="'+id+'"')+row('test-node','gauge','重新测试','','','data-id="'+id+'"'))+'<p class="caption">真实产品的服务器和凭据默认隐藏，预览不保存任何真实节点信息。</p>');}
function openInspector(kind,id,heading,body){if(!state.inspector)inspectorFocus=document.activeElement;state.inspector={kind,id};$('main').classList.add('has-inspector');$('inspector').hidden=false;$('inspector').innerHTML='<button class="icon-button close" data-action="close-inspector" aria-label="关闭详情">'+icon('close')+'</button><h2>'+heading+'</h2>'+body;$('inspector').focus();}
function closeInspector(){state.inspector=null;$('inspector').hidden=true;$('inspector').innerHTML='';$('main').classList.remove('has-inspector');if(inspectorFocus?.isConnected)inspectorFocus.focus();inspectorFocus=null;}
function renderProfiles(){if(state.sub==='details'){configDetails();return;}if(state.sub==='rules'){rulesEditor();return;}if(state.sub==='maintenance'){maintenance();return;}if(state.scenario==='empty'){page.innerHTML='<div class="group">'+row('add','import','导入配置…')+'</div><div class="empty">还没有配置。添加订阅链接、本地文件或节点分享链接。</div>';return;}page.innerHTML='<div class="group">'+row('add','import','导入…')+row('update-subscription','refresh','更新订阅','','只准备候选，运行版本保持')+'</div>'+section('远程订阅',profileRow(profiles[0]))+'<p class="caption">勾选表示当前使用；有更新时先查看变化，再明确应用。</p>'+section('本地配置',profileRow(profiles[1]))+'<p class="caption">本地文件保留为独立快照，不依赖原文件继续存在。</p>';}

function configDetails(){const p=profile();page.innerHTML='<div class="editor">'+back('config-back','返回配置')+'<div class="detail-head"><h2 class="detail-title">'+escape(p.name)+'</h2><p>'+p.kind+' · '+(p.current?'正在使用':'尚未使用')+(p.pending?' · 有候选':'')+'</p></div><div class="group">'+row(p.pending?'changes':'use-profile',p.pending?'refresh':'check',p.pending?'查看候选变化':'使用此配置',p.current&&!p.pending?'当前':'')+'</div>'+section('配置内容',row('rules','route','规则与分流')+row('config-dns','globe','DNS')+row('config-nodes','layers','节点与策略组')+row('config-chain','route','拨号链'))+section('来源与维护',row('maintenance','clock','更新与维护',p.id==='remote'?'12 小时':'手动')+row('provider','layers','Provider','2 个')+row('profile-source','folder','来源信息'))+'<p class="caption">浏览与编辑都绑定本配置的明确版本，不隐式应用待更新候选。</p></div>';}
function showChanges(){const p=profile();showDialog('候选变化 · '+p.name,'<div class="group">'+kv([['对象','独立候选版本'],['节点','新增 2 · 删除 0'],['规则','修改 1'],['当前运行','保持不变']])+'</div><p class="caption">确认后才校验并切换。失败保留当前运行版与候选。</p><label class="field" style="margin-top:14px"><input id="fail-apply" type="checkbox" style="display:inline;width:auto"> 演示应用失败</label>'+button('apply-candidate','应用此候选','primary'));}
function maintenance(){const p=profile();page.innerHTML='<div class="editor">'+back('details-back','返回配置详情')+'<div class="detail-head"><h2 class="detail-title">更新与维护</h2><p>'+escape(p.name)+' · '+p.kind+'</p></div><div class="group">'+kv([['上次成功','今天 10:24 · 示例'],['自动更新',p.id==='remote'?'开启 · 每 12 小时':'不适用：文件快照'],['下次检查',p.id==='remote'?'今天 22:24 · 示例':'手动重新导入'],['最近失败','无'],['来源用量',p.id==='remote'?'已用 24 GB / 总计 100 GB':'来源未提供'],['来源到期',p.id==='remote'?'示例日期：30 天后':'未知']])+'</div><div class="actions">'+button(p.id==='remote'?'update-subscription':'add',p.id==='remote'?'重新下载':'重新导入','primary')+'</div><p class="caption">真实来源未提供总量/到期时不显示猜测值，失败保留当前版本。</p></div>';}
function providerDialog(){showDialog('Provider 维护','<div class="group">'+row('refresh-provider','refresh','示例节点来源','可更新','上次成功：今天 10:24')+row('refresh-provider','refresh','示例规则来源','失败可重试','运行快照保持不变')+'</div><p class="caption">来源 → Provider → 候选 → 运行版。更新只生成候选，不对冻结文件执行假刷新。</p>');}
function rulesEditor(){const r=state.draftRule||{type:'DOMAIN-SUFFIX',value:'example.invalid',target:'DIRECT'};page.innerHTML='<div class="editor">'+back('rules-back','返回配置详情')+'<div class="detail-head"><h2 class="detail-title">规则与分流</h2><p>对象：'+escape(profile().name)+' · 运行版；候选保持独立</p></div><div class="group" style="padding:16px"><label class="field">规则类型<select id="rule-type"><option value="DOMAIN-SUFFIX">域名后缀 · DOMAIN-SUFFIX</option><option value="DOMAIN">完整域名 · DOMAIN</option><option value="IP-CIDR">IP 网段 · IP-CIDR</option></select></label><label class="field">匹配内容<input id="rule-value" value="'+escape(r.value)+'"></label><label class="field">目标策略<select id="rule-target"><option value="DIRECT">直连 · DIRECT</option><option value="示例节点组">示例节点组</option><option value="REJECT">拒绝 · REJECT</option></select></label><label class="field">规则位置<select id="rule-position"><option>前置：优先于订阅规则</option><option>追加：置于来源规则之后</option></select></label></div><p class="notice" id="rule-error" hidden></p><p class="caption">此处为草稿，尚未写入配置。保存需要完整校验；取消保留运行版。</p><div class="actions">'+button('cancel-rule','取消')+button('save-rule','保存并校验','primary')+'</div></div>';$('rule-type').value=r.type;$('rule-target').value=r.target;}
function renderData(){page.innerHTML='<div class="tabs" role="tablist" aria-label="数据任务">'+[['traffic','流量'],['connections','连接'],['tests','网站测试'],['logs','日志']].map(([v,n])=>'<button role="tab" data-action="data-tab" data-id="'+v+'" aria-selected="'+(state.tab===v)+'">'+n+'</button>').join('')+'</div><div id="data-content"></div>';const content=$('data-content');if(state.tab==='traffic')content.innerHTML='<div class="metrics">'+[['下载','1.24 MB/s'],['上传','82 KB/s'],['活动连接','12']].map(([k,v])=>'<div class="metric"><span>'+k+'</span><strong>'+v+'</strong></div>').join('')+'</div><p class="caption">全部为合成数值，不代表当前电脑流量。真实产品仅页面可见时有界采样。</p>'+section('诊断',row('outbound','globe','出口与服务诊断','按需检测'));if(state.tab==='connections')renderConnections();if(state.tab==='tests')content.innerHTML='<div class="data-tools"><span class="muted">测试节点：'+escape(node().name)+'</span>'+button('all-websites','开始测试','primary')+'</div><div class="services">'+['YouTube','ChatGPT','Google','GitHub','Cloudflare','自定义目标'].map((n,i)=>'<div class="service"><div class="service-head">'+icon('globe')+'<span>'+n+'</span></div><span class="row-sub">合成响应示例</span><strong>'+(120+17*i)+' ms</strong>'+button('test-website','重测','secondary','data-id="'+i+'"')+'</div>').join('')+'</div><p class="caption">响应不代表服务解锁、带宽或全部流量可用。</p>';if(state.tab==='logs')content.innerHTML='<div class="data-tools">'+button('pause-data',state.paused?'恢复观察':'暂停')+button('export-log','导出脱敏诊断')+'</div><div class="group"><pre class="log">[示例] 配置校验完成\n[示例] 控制面与端口归属已确认\n[示例] 模式回读完成\n[示例] 当前节点选择已确认</pre></div><p class="caption">'+(state.paused?'观察已暂停，保留当前快照。':'查看历史不强制滚回尾部。')+'</p>';}
function renderConnections(){const list=connections.filter(c=>state.connFilter==='active'?c.active:!c.active);$('data-content').innerHTML='<div class="data-tools"><button class="pill" data-action="conn-filter" data-id="active" aria-pressed="'+(state.connFilter==='active')+'">活动 '+connections.filter(c=>c.active).length+'</button><button class="pill" data-action="conn-filter" data-id="closed" aria-pressed="'+(state.connFilter==='closed')+'">已离开 '+connections.filter(c=>!c.active).length+'</button>'+button('pause-data',state.paused?'恢复':'暂停')+'<input id="connection-search" placeholder="搜索目标、规则、进程" aria-label="搜索连接">'+tool('columns','settings','显示连接列')+'</div><div class="table-wrap"><table><thead><tr><th>目标</th><th>命中规则</th><th>代理链</th><th>状态</th></tr></thead><tbody>'+list.map(c=>'<tr data-connection-row="'+c.id+'"><td><button data-action="connection-info" data-id="'+c.id+'">'+escape(c.host)+'</button><span class="row-sub">'+escape(c.process)+'</span></td><td>'+c.rule+'</td><td>'+escape(c.chain)+'</td><td>'+(state.paused?'暂停快照':c.active?'活动':'已离开')+'</td></tr>').join('')+'</tbody></table>'+(!list.length?'<div class="empty">当前观察会话没有此类连接</div>':'')+'</div><p class="caption">'+(state.paused?'采样已暂停；显示冻结快照。':'点击目标查看规则与代理路径。离页或隐藏停止采样，不保存连接历史。')+'</p>';}
function connectionInfo(id){const c=connections.find(c=>c.id===id);const stale=c.profile!==state.profile||c.generation!==state.generation;openInspector('connection',id,escape(c.host),'<p class="caption">'+(stale?'旧配置会话：只读，禁止关联写入':'当前合成观察快照')+'</p><div class="group">'+kv([['目标',c.host],['命中规则',c.rule+(c.payload?'('+c.payload+')':'')],['代理路径',c.chain],['状态',c.active?'活动快照':'已离开'],['进程',c.process],['配置',profiles.find(p=>p.id===c.profile).name]])+'</div>'+section('诊断操作',row('connection-group','layers','查看此代理组','','','data-id="'+id+'" '+(stale?'disabled':''))+row('draft-connection-rule','route','以此目标新建规则','','仅预填草稿，不直接保存','data-id="'+id+'" '+(stale?'disabled':''))+row('copy-connection','copy','复制脱敏详情','','','data-id="'+id+'"')+(c.active?row('close-connection','close','关闭此连接','','确认后核对原 ID','data-id="'+id+'"') : '')));}
function renderSettings(){if(state.sub==='network'){networkEditor();return;}const toggle=(name,key)=>'<div class="action-row">'+icon('settings')+'<span class="row-body">'+name+'</span><button class="switch" role="switch" aria-label="'+name+'" aria-checked="'+state[key]+'" data-action="setting-toggle" data-id="'+key+'"></button></div>';page.innerHTML='<div class="group">'+row('appearance','moon','外观',state.theme==='dark'?'深色':'浅色')+row('text-size','settings','文字大小',state.scale+'%')+'</div>'+section('通用',row('startup','home','启动与托盘')+row('hotkeys','settings','快捷键')+toggle('关闭窗口时释放界面','lightweight')+toggle('登录启动','autoStart'))+section('连接与网络',row('network','route','本地代理','端口 '+state.networkPort)+row('tun','layers','TUN 虚拟网卡','未启用')+row('bypass','globe','系统代理排除')+row('settings-dns','globe','DNS 设置'))+section('维护与数据',row('core','layers','内核管理','固定补丁内核')+row('backup','folder','备份与恢复')+row('geo','globe','Geo 数据')+row('outbound','gauge','诊断'))+section('关于',row('about','info','Mlash','最终 UI 方案'));}
function networkEditor(){page.innerHTML='<div class="editor">'+back('settings-back','返回设置')+'<div class="detail-head"><h2 class="detail-title">本地代理</h2><p>修改需要校验并安全重启内核</p></div><div class="group" style="padding:16px"><label class="field">HTTP / SOCKS5 共用端口<input id="network-port" type="number" min="1024" max="65535" value="'+state.networkPort+'"></label><label class="field">日志等级<select><option>警告</option><option>信息</option><option>调试</option></select></label></div><p id="network-error" class="notice" hidden></p><p class="caption">保存后校验与重启；失败保留原运行版和草稿。原型不启动进程。</p><div class="actions">'+button('settings-back','取消')+button('save-network','保存并重启','primary')+'</div></div>';}
function addDialog(){showDialog('添加配置',choice('import-kind','订阅链接',false,'HTTPS YAML 配置','data-id="url"')+choice('import-kind','配置文件',false,'独立本地文件快照','data-id="file"')+choice('import-kind','节点分享链接',false,'先离线预览，再明确导入','data-id="nodes"')+'<p class="caption">确认前不联网、不激活。预览不会读取剪贴板或文件。</p>');}
function importForm(kind){showDialog(kind==='url'?'添加订阅':kind==='file'?'导入配置文件':'导入节点链接','<label class="field">名称<input id="import-name" value="新示例配置"></label><label class="field">'+(kind==='url'?'订阅 URL':kind==='file'?'示例文件名':'节点链接内容')+'<input id="import-source" placeholder="'+(kind==='url'?'https://example.invalid/profile.yaml':kind==='file'?'example.yaml':'粘贴节点分享链接')+'"></label><p class="notice" id="import-error" hidden></p><p class="caption">来源字段仅用于输入流程演示，不下载、不读取文件、不持久化。</p>'+button('import-confirm','预览并确认','primary'));}
function pending(label,done){if(state.pending)return;state.pending=label;status(label);if(state.view==='home')renderHome();timer=setTimeout(()=>{state.pending=null;done();render();},380);}
const actions={
 'add':addDialog,'dialog-close':closeDialog,'close-inspector':closeInspector,
 'mode':()=>showDialog('全局路由',['配置规则','全局代理','全部直连'].map(m=>choice('choose-mode',m,state.mode===m,'','data-id="'+m+'"')).join('')+'<p class="caption">模式变更只在实际回读后生效，不代表所有网站同一出口。</p>'),
 'choose-mode':b=>{state.mode=b.dataset.id;closeDialog();renderHome();status('模式回读示例：'+state.mode)},
 'connect':()=>{if(state.scenario==='empty'){addDialog();return}if(state.scenario==='error'){actions['status-details']();return}if(state.scenario==='external'){showDialog('接管系统代理','<p class="caption">系统已有外部代理。明确接管后保存完整快照，退出时只恢复仍属于 Mlash 的写入。</p>'+button('confirm-takeover','确认接管','primary'));return}const next=!state.connected;pending(next?'正在连接并核对归属':'正在恢复系统代理',()=>{state.connected=next;status(next?'系统代理已接管':'系统代理已恢复')})},
 'confirm-takeover':()=>{closeDialog();pending('正在保存快照并接管',()=>{state.scenario='running';$('scenario').value='running';state.connected=true;status('接管回读成功')})},
 'probe':()=>status('当前节点示例响应 138ms；没有网络请求'), 'groups':groupsDialog,
 'choose-group':b=>{state.group=b.dataset.id;state.testUrl=state.groupUrls[state.group]||'https://www.gstatic.com/generate_204';state.delayFresh=false;state.recentGroups=[state.group,...state.recentGroups.filter(g=>g!==state.group)].slice(0,3);closeDialog();renderHome();status('只改变浏览组，运行成员保持')},
 'node-more':nodeMenu,'sort':b=>{state.sort=b.dataset.id;closeDialog();drawNodes();status('排序已调整，运行成员保持')},
 'favorites':()=>{state.onlyFavorites=!state.onlyFavorites;closeDialog();drawNodes()},'clear-filter':()=>{state.search='';state.onlyFavorites=false;if($('node-search'))$('node-search').value='';drawNodes()},
 'locate':locateCurrent,'reveal-current':()=>{actions['clear-filter']();closeDialog();locateCurrent()},'test-settings':testSettings,
 'save-test-url':()=>{const value=$('test-url').value.trim();let url;try{url=new URL(value)}catch{}if(!url||!['http:','https:'].includes(url.protocol)||url.username||url.password){status('测试地址须是无凭据的 HTTP/HTTPS URL');return}state.testUrl=value;state.groupUrls[state.group]=value;state.delayFresh=false;closeDialog();drawNodes();status('本组目标已更改，旧结果标为过期')},
 'select-node':b=>{if(group().automatic){showNodeInfo(b.dataset.id);return}if(state.current===b.dataset.id){status('已经是当前成员，不重复提交');return}const id=b.dataset.id;pending('正在切换成员并回读',()=>{state.current=id;status('成员回读成功')})},
 'node-info':b=>showNodeInfo(b.dataset.id),
 'test-node':b=>{const id=b.dataset.id,n=nodes.find(n=>n.id===id);b.disabled=true;b.textContent='测试中';const context=state.testUrl;setTimeout(()=>{if(context!==state.testUrl)return;n.delay=138+nodes.indexOf(n)*13;state.delayFresh=true;drawNodes();if(state.inspector?.kind==='node'&&state.inspector.id===id)showNodeInfo(id);status('单节点示例结果已更新，选择未改变')},250)},
 'test-all':()=>{nodes.forEach((n,i)=>n.delay=90+i*31);state.delayFresh=true;drawNodes();status('整组示例结果更新，无网络请求')},
 'favorite-node':b=>{const id=b.dataset.id;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);drawNodes();showNodeInfo(id)},
 'profile-details':b=>{state.detailProfile=b.dataset.id;state.sub='details';renderProfiles();page.focus()},'config-back':()=>{state.sub='';renderProfiles()},'details-back':()=>{state.sub='details';renderProfiles()},'changes':showChanges,
 'apply-candidate':()=>{const fail=$('fail-apply').checked;const object=profile();closeDialog();pending('正在校验候选',()=>{if(fail){status('应用失败；原运行版和候选保留');return}object.pending=false;status('候选已应用并回读，原版可回退')})},
 'use-profile':()=>{const p=profile();showDialog('使用 '+p.name,'<p class="caption">将校验并切换运行配置，浏览不会触发此事务。</p>'+button('confirm-use','使用此配置','primary'))},
 'confirm-use':()=>{const id=state.detailProfile;closeDialog();pending('正在切换配置',()=>{profiles.forEach(p=>p.current=p.id===id);state.profile=id;state.generation++;status('运行配置已切换，旧连接详情仅可读')})},
 'update-subscription':()=>{profiles[0].pending=true;status('新候选已准备，运行版未改变');render()},
 'maintenance':()=>{state.sub='maintenance';renderProfiles()},'provider':providerDialog,'refresh-provider':()=>{profile().pending=true;status('Provider 候选已生成，运行快照未改变')},
 'profile-source':()=>showDialog('来源信息','<div class="group">'+kv([['类型',profile().kind],['地址','默认隐藏'],['凭据','不显示']])+'</div><p class="caption">真实产品的查看与复制均需明确动作，不将令牌放入提示和日志。</p>'),
 'rules':()=>{state.sub='rules';state.ruleDirty=false;renderProfiles()},
 'rules-back':()=>{if(state.ruleDirty){showDialog('放弃未保存规则？','<p class="caption">取消返回将保留草稿继续编辑。</p>'+button('discard-rule','放弃修改','danger'));return}state.sub='details';renderProfiles()},
 'discard-rule':()=>{closeDialog();state.ruleDirty=false;state.draftRule=null;state.sub='details';renderProfiles()},'cancel-rule':()=>{state.ruleDirty=false;state.draftRule=null;state.sub='details';renderProfiles()},
 'save-rule':()=>{const value=$('rule-value').value.trim();if(!value){$('rule-error').hidden=false;$('rule-error').textContent='请填写匹配内容，草稿未丢弃。';return}state.draftRule={type:$('rule-type').value,value,target:$('rule-target').value};state.ruleDirty=false;status('规则校验与保存示例；候选保持独立');state.sub='details';renderProfiles()},
 'data-tab':b=>{closeInspector();state.tab=b.dataset.id;renderData();status('仅当前可见任务采样，其余停止')},'pause-data':()=>{state.paused=!state.paused;renderData();status(state.paused?'当前观察快照已暂停':'重新建立观察与速率基线')},'conn-filter':b=>{state.connFilter=b.dataset.id;closeInspector();renderConnections()},
 'connection-info':b=>connectionInfo(b.dataset.id),'connection-group':()=>{closeInspector();state.group='main';navigate('home');status('已转到对应浏览组，未选择节点')},
 'draft-connection-rule':b=>{const c=connections.find(c=>c.id===b.dataset.id);if(c.profile!==state.profile||c.generation!==state.generation){status('上下文已过期，禁止为当前配置生成草稿');return}state.draftRule={type:'DOMAIN',value:c.domain,target:'示例节点组'};state.detailProfile=c.profile;closeInspector();state.view='profiles';state.sub='rules';state.ruleDirty=true;render();status('仅预填规则草稿，尚未保存')},
 'copy-connection':()=>status('已准备脱敏详情；设计原型不写系统剪贴板'),
 'close-connection':b=>{const id=b.dataset.id;showDialog('关闭此连接？','<p class="caption">仅关闭当前观察的原 ID，不影响后来新建连接。</p>'+button('confirm-close','确认关闭','danger','data-id="'+id+'"'))},
 'confirm-close':b=>{connections.find(c=>c.id===b.dataset.id).active=false;closeDialog();closeInspector();renderData();status('原连接 ID 已消失：回读示例')},

 'all-websites':()=>status('全部网站响应示例已完成，不代表服务解锁'),'test-website':()=>status('单网站重测示例，其他结果保持'),'export-log':()=>status('脱敏导出流程示例，不生成真实诊断文件'),
 'appearance':()=>showDialog('外观',choice('set-theme','深色',state.theme==='dark','','data-id="dark"')+choice('set-theme','浅色',state.theme==='light','','data-id="light"')),
 'set-theme':b=>{state.theme=b.dataset.id;applyTheme();closeDialog();renderSettings()},'text-size':()=>showDialog('文字大小',[100,110,120].map(n=>choice('set-scale',n+'%',state.scale===n,'','data-id="'+n+'"')).join('')),
 'set-scale':b=>{state.scale=+b.dataset.id;applyScale();closeDialog();renderSettings()},'setting-toggle':b=>{state[b.dataset.id]=!state[b.dataset.id];renderSettings();status('偏好即时保存示例')},
 'network':()=>{state.sub='network';renderSettings()},'settings-back':()=>{state.sub='';renderSettings()},
 'save-network':()=>{const n=+$('network-port').value;if(!Number.isInteger(n)||n<1024||n>65535){$('network-error').hidden=false;$('network-error').textContent='端口须为 1024–65535 的整数。运行配置未改变，草稿保留。';return}state.networkPort=n;state.sub='';renderSettings();status('网络参数校验/重启回读示例，没有真实进程操作')},
 'tun':()=>showDialog('TUN 虚拟网卡','<div class="group">'+kv([['服务','未安装 · 合成场景'],['内核','随包固定哈希'],['启用','默认关闭']])+'</div><p class="caption">真实安装需 UAC；意图、服务、运行观测分别表达。不由系统代理开关隐式安装或启用。</p>'+button('tun-plan','查看安装与恢复条件','secondary')),
 'tun-plan':()=>status('TUN 安装/恢复条件已说明，未安装服务'),
 'backup':()=>showDialog('备份与恢复',choice('backup-create','创建密码备份',false,'明确密码与范围')+choice('backup-restore','恢复备份',false,'先停止条件 → 预览 → 选择 → 确认')+choice('backup-plan','自动备份与保护',false,'默认关闭，显式启用才执行')),
 'backup-create':()=>showDialog('创建密码备份','<label class="field">备份密码<input type="password" autocomplete="off" placeholder="仅用于设计演示"></label><p class="caption">预览不读取数据，不创建文件；真实备份独立密码加密。</p>'),
 'backup-restore':()=>showDialog('恢复预览','<p class="caption">真实恢复前需停止内核并释放自有代理。恢复为新增项，不覆盖已有配置，不自动连接。</p><label class="field"><input type="checkbox" checked style="display:inline;width:auto"> 示例配置（恢复 1）</label>'+button('restore-confirm','确认新增恢复','primary')),
 'restore-confirm':()=>{closeDialog();status('新增恢复示例，未启动内核或连接')},'backup-plan':()=>showDialog('备份计划','<p class="caption">计划默认关闭。开启后主窗口关闭仍可能运行，退出程序停止；密码与真实配置不进入本原型。</p>'),
 'core':()=>showDialog('内核管理','<div class="group">'+kv([['当前来源','随包固定补丁'],['替换方式','选择或下载 → 副本预检 → 明确应用'],['失败恢复','保留可回退副本']])+'</div><p class="caption">TUN 仅运行固定内核，其他内核须先关闭 TUN。原型不下载或执行文件。</p>'),
 'outbound':()=>showDialog('出口与服务诊断','<p class="caption">明确选择传输路径后按需检测。这里只展示入口，不发送公网请求，不推测地区或服务解锁。</p>'),
 'status-details':()=>showDialog('操作与告警','<p>'+escape($('message').textContent)+'</p><p class="notice">'+escape($('alarm').textContent||'当前无演示告警')+'</p><p class="caption">真实恢复失败必须保留日志并阻止错误接管，不能用一次成功通知清除。</p>'),
 'import-kind':b=>importForm(b.dataset.id),'import-confirm':()=>{if(!$('import-name').value.trim()||!$('import-source').value.trim()){$('import-error').hidden=false;$('import-error').textContent='请补充名称和来源；输入保持。';return}closeDialog();status('导入预览确认示例；真实配置列表和当前运行均未修改')},
 'about':()=>showDialog('关于 Mlash','<p>Shadowrocket 为主视觉方向，Verge 仅补充对象上下文与就近操作。</p><p class="caption">本文件是最终设计优化稿，不是已发布产品或功能验收证明。</p><p class="caption">内置国旗：Twemoji v14.0.2，© Twitter, Inc. and other contributors；CC BY 4.0（creativecommons.org/licenses/by/4.0/）。原始 PNG 未修改，仅显示缩放。</p>')
};
['config-dns','config-nodes','config-chain','startup','hotkeys','bypass','settings-dns','geo'].forEach(key=>actions[key]=()=>showDialog(({ 'config-dns':'DNS 覆盖','config-nodes':'节点与策略组','config-chain':'拨号链',startup:'启动与托盘',hotkeys:'快捷键',bypass:'系统代理排除','settings-dns':'DNS 设置',geo:'Geo 数据'})[key],'<p class="caption">此处代表已保留的高级功能入口，采用独立详情/任务窗口。完整字段与提交协议按现有能力和系统设计实施，本原型不声称已覆盖所有高级编辑器。</p>'));
document.querySelector('.nav').innerHTML=[['home','home','首页'],['profiles','folder','配置'],['data','data','数据'],['settings','settings','设置']].map(([id,glyph,n])=>'<button data-nav="'+id+'">'+icon(glyph)+n+'</button>').join('');
$('leading').innerHTML=icon('import');$('leading').dataset.action='add';$('trailing').innerHTML=icon('plus');$('trailing').dataset.action='add';
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){if(state.ruleDirty){showDialog('有未保存规则','<p class="caption">请先保存或取消规则草稿，再离开当前编辑任务。</p>');return}navigate(nav.dataset.nav);return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;actions[b.dataset.action]?.(b)});
document.addEventListener('input',e=>{if(e.target.id==='node-search'){state.search=e.target.value;drawNodes()}if(e.target.id==='group-search'){dialog.querySelectorAll('[data-action=choose-group]').forEach(b=>b.hidden=!b.textContent.includes(e.target.value))}if(e.target.id==='connection-search'){document.querySelectorAll('[data-connection-row]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(e.target.value.toLowerCase()))}if(['rule-value','rule-type','rule-target','rule-position'].includes(e.target.id)){state.ruleDirty=true;state.draftRule={type:$('rule-type').value,value:$('rule-value').value,target:$('rule-target').value};}});
document.addEventListener('change',e=>{if(['rule-type','rule-target','rule-position'].includes(e.target.id)){state.ruleDirty=true;state.draftRule={type:$('rule-type').value,value:$('rule-value').value,target:$('rule-target').value};}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open&&state.inspector){closeInspector();page.focus()}if((e.ctrlKey||e.metaKey)&&e.key==='f'&&$('node-search')){e.preventDefault();$('node-search').focus()}if(e.key==='F5'&&state.view==='home'){e.preventDefault();const b=document.querySelector('[data-action=test-node][data-id="'+state.current+'"]');if(b)actions['test-node'](b)}if(e.target.matches('[data-nav]')&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const all=[...document.querySelectorAll('[data-nav]')],i=all.indexOf(e.target);all[(i+(e.key==='ArrowDown'?1:all.length-1))%all.length].focus()}});
function applyTheme(){document.documentElement.dataset.theme=state.theme;$('theme').textContent=state.theme==='dark'?'浅色':'深色';}function applyScale(){document.documentElement.style.setProperty('--font',(15*state.scale/100)+'px');$('scale').textContent='文字 '+state.scale+'%';}
$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme()};$('scale').onclick=()=>{state.scale=state.scale===100?120:100;applyScale()};
$('scenario').onchange=e=>{clearTimeout(timer);state.pending=null;state.ruleDirty=false;state.scenario=e.target.value;state.connected=state.scenario==='running';state.view='home';state.sub='';closeDialog();closeInspector();render();status('已切换合成场景：'+e.target.selectedOptions[0].textContent)};
dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});render();
</script>
